<script>
function rsdToHtml(rsdText) {
  // 1. 去掉外层 <rsd>
  let body = rsdText.replace(/<\/?rsd[^>]*>/g, "").trim();

  // 2. line → div（带对齐）
  body = body.replace(
    /<line([^>]*)>([\s\S]*?)<\/line>/g,
    (match, attrs, content) => {
      let justifyMatch = attrs.match(/justify="(.*?)"/);
      let align = justifyMatch ? justifyMatch[1] : "left";
      return `<div style="text-align:${align}; margin:4px 0;">${content}</div>`;
    }
  );

  // 3. 标题：h1 / h2 保留为 HTML 标题
  body = body.replace(/<h1>([\s\S]*?)<\/h1>/g, "<h1>$1</h1>");
  body = body.replace(/<h2>([\s\S]*?)<\/h2>/g, "<h2>$1</h2>");

  // 4. 基本文本样式
  body = body.replace(/<b>([\s\S]*?)<\/b>/g, "<b>$1</b>");
  body = body.replace(/<i>([\s\S]*?)<\/i>/g, "<i>$1</i>");
  body = body.replace(/<u>([\s\S]*?)<\/u>/g, "<u>$1</u>");
  body = body.replace(/<s>([\s\S]*?)<\/s>/g, "<s>$1</s>");

  // 5. 颜色 & 高亮
  body = body.replace(
    /<color co="(.*?)">([\s\S]*?)<\/color>/g,
    '<span style="color:$1">$2</span>'
  );
  body = body.replace(
    /<highlight co="(.*?)">([\s\S]*?)<\/highlight>/g,
    '<span style="background-color:$1">$2</span>'
  );

  // 6. 链接
  body = body.replace(
    /<link url="(.*?)">([\s\S]*?)<\/link>/g,
    '<a href="$1" target="_blank">$2</a>'
  );

  // 7. 清理多余空行（可选）
  return body;
}
</script>
