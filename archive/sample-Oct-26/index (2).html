	<script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd/index.js"></script>
	
	<script>
		class DBStorage {
			constructor(dbName = 'ProjectFilesDB', storeName = 'files') {
				this.dbName = dbName;
				this.storeName = storeName;
				this.db = null;
			}

			/**
			 * 1. ??? (?? Promise ??)
			 */
			async init() {
				if (this.db) return { success: true, code: 0 };
				return new Promise((resolve) => {
					const request = indexedDB.open(this.dbName, 1);
					request.onupgradeneeded = (e) => {
						const db = e.target.result;
						if (!db.objectStoreNames.contains(this.storeName)) {
							db.createObjectStore(this.storeName);
						}
					};
					request.onsuccess = (e) => {
						this.db = e.target.result;
						resolve({ success: true, code: 0 });
					};
					request.onerror = () => resolve({ success: false, msg: "?????", code: 1 });
				});
			}

			/**
			 * 2. ????
			 * @param {Object} fileMap - ??: {'a.txt': '??', 'b.jpg': blob}
			 */
			async batchSave(fileMap) {
				return new Promise((resolve) => {
					try {
						const tx = this.db.transaction([this.storeName], 'readwrite');
						const store = tx.objectStore(this.storeName);
						for (const [path, content] of Object.entries(fileMap)) {
							store.put(content, path);
						}
						tx.oncomplete = () => resolve({ success: true, code: 0 });
						tx.onerror = () => resolve({ success: false, msg: "??????", code: 1 });
					} catch (e) {
						resolve({ success: false, msg: e.message, code: 1 });
					}
				});
			}

			/**
			 * 3. ??????
			 */
			async getFile(path) {
				return new Promise((resolve) => {
					const tx = this.db.transaction([this.storeName], 'readonly');
					const store = tx.objectStore(this.storeName);
					const request = store.get(path);
					request.onsuccess = () => resolve({ success: true, data: request.result, code: 0 });
					request.onerror = () => resolve({ success: false, msg: "????", code: 1 });
				});
			}

			/**
			 * 4. ?????? (??????)
			 */
			async getAllPaths(prefix = "") {
				return new Promise((resolve) => {
					const tx = this.db.transaction([this.storeName], 'readonly');
					const store = tx.objectStore(this.storeName);
					const range = prefix ? IDBKeyRange.bound(prefix, prefix + '\uffff') : null;
					const request = store.getAllKeys(range);
					request.onsuccess = () => resolve({ success: true, data: request.result, code: 0 });
					request.onerror = () => resolve({ success: false, data: [], code: 1 });
				});
			}

			/**
			 * 5. ?????? ? ????
			 * @param {String|Array} paths - ????????????
			 */
			async deleteFiles(paths) {
				return new Promise((resolve) => {
					try {
						const pathList = Array.isArray(paths) ? paths : [paths];
						const tx = this.db.transaction([this.storeName], 'readwrite');
						const store = tx.objectStore(this.storeName);
						for (const path of pathList) {
							store.delete(path);
						}
						tx.oncomplete = () => resolve({ success: true, code: 0 });
						tx.onerror = () => resolve({ success: false, msg: "????", code: 1 });
					} catch (e) {
						resolve({ success: false, msg: e.message, code: 1 });
					}
				});
			}
		}
