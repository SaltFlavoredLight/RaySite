<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ray Studio Website Bulider 1.0 version.</title>
	
	<style>
		:root {
			--theme1: #c5c5c5;
			--theme2: #666666;
			--theme3: #FFFFFF;
		}
		
		body {
			margin: 0;
			padding: 0;
			letter-spacing: 0.4px;
			overflow: hidden;

			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;

			background-repeat: no-repeat;
			background-size: cover;
			background-position: center;
		}
	
        button {
            display: inline-block;
            border-radius: 30px;
            margin: 0;
            padding: 8px 16px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
			background: inherit;
			color: black;
			font-weight: 600;
			font-size: 17px;
			transition: background 0.5s ease, height 0.5s ease, background-color 0.5s ease;
			letter-spacing: 0.4px;
        }
	</style>

	<style>
		.app-toolbar {
			position: absolute;
			top: 0px;
			left: 0px;
			
			width: 100%;
			height: 78px;
			
			background-color: var(--theme1);
			
			display: flex;
			flex-direction: column;
			box-sizing: border-box;
			padding: 10px 50px;
		}
		
		.app-toolbar-menu {
			width: 100%;
			height: 40px;
		}
		
		.app-toolbar-copy {
			width: 100%;
			height: 18px;
		}
		
		.app-toolbar-copy > p {
			margin: 0;
		}
	</style>
</head>
<body>
	<div class="app-toolbar">
		<div class="app-toolbar-copy">
			<p>Ray Studio Website Bulider, Copyright &copy; 2025 Ray Zuo.</p>
		</div>	
	<div class="app-toolbar-menu">
			
		</div>
	</div>
</html>
