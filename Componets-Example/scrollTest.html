<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RaySiteUI Scroll Overflow Example</title>
<style>
    :root {
        --ui-space-1: 4px;
        --ui-space-2: 8px;
        --ui-space-m: 12px;
        --ui-border-default: 1px solid #c7c7c7;
        --ui-theme-white-2: #f7f4f4;
    }


    /* UI CSS System reset */
    *, *::before, *::after {
        box-sizing: border-box;
    }

    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, p, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, embed, 
    figure, figcaption, footer, header, hgroup, 
    menu, nav, output, ruby, section, summary,
    time, mark, audio, video {
        margin: 0;
        padding: 0;
        border: 0;
        vertical-align: baseline;
    }

    html, body, div, span, applet, object, iframe, p, blockquote, pre,
    a, abbr, acronym, address, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    strike, sub, sup, tt, var, center,
    dl, dt, dd, ol, ul, li,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, embed, 
    figure, figcaption, footer, header, hgroup, 
    menu, nav, output, ruby, section, summary,
    time, mark, audio, video {
        font-size: 100%;
        font: inherit;
    }

    /* HTML5 display-role reset for older browsers */
    article, aside, details, figcaption, figure, 
    footer, header, hgroup, menu, nav, section {
        display: block;
    }
    body {
        line-height: 1;
    }
    ol, ul {
        list-style: none;
    }



    .RaySiteUI-scrollWrap {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        max-width: 100%;
        margin: 40px auto;
    }

    .RaySiteUI-scrollArea {
        overflow-x: auto;
        scroll-behavior: smooth;
        display: flex;
        gap: var(--ui-space-m);
        padding: var(--ui-space-1) 0;
        flex: 1;
        border: var(--ui-border-default);
        border-radius: var(--ui-space-1);
        padding-left: var(--ui-space-2);
        padding-right: var(--ui-space-2);
    }

    .RaySiteUI-scrollArea::-webkit-scrollbar {
        display: none;
    }

    .RaySiteUI-scrollItem {
        min-width: 120px;
        padding: var(--ui-space-2);
        background: #eee;
        border-radius: var(--ui-space-1);
        text-align: center;
        flex-shrink: 0;
    }

    .RaySiteUI-scrollBtn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        padding: var(--ui-space-1) var(--ui-space-2);
        background: var(--ui-theme-white-2);
        border: var(--ui-border-default);
        border-radius: var(--ui-space-1);
        cursor: pointer;
        display: none;
        z-index: 10;
        user-select: none;
    }

    .RaySiteUI-scrollBtn.left {
        left: 0;
        transform: translate(-50%, -50%);
    }

    .RaySiteUI-scrollBtn.right {
        right: 0;
        transform: translate(50%, -50%);
    }
</style>
</head>
<body>

<div class="RaySiteUI-scrollWrap">
    <button class="RaySiteUI-scrollBtn left">‹</button>

    <div class="RaySiteUI-scrollArea">
        <div class="RaySiteUI-scrollItem">Item 1</div>
        <div class="RaySiteUI-scrollItem">Item 2</div>
        <div class="RaySiteUI-scrollItem">Item 3</div>
        <div class="RaySiteUI-scrollItem">Item 4</div>
        <div class="RaySiteUI-scrollItem">Item 5</div>
        <div class="RaySiteUI-scrollItem">Item 6</div>
        <div class="RaySiteUI-scrollItem">Item 7</div>
        <div class="RaySiteUI-scrollItem">Item 8</div>
        <div class="RaySiteUI-scrollItem">Item 9</div>
        <div class="RaySiteUI-scrollItem">Item 10</div>
    </div>

    <button class="RaySiteUI-scrollBtn right">›</button>
</div>

<script>
(function() {
    function initScrollSnap(root) {
        const area = root.querySelector(".RaySiteUI-scrollArea");
        const btnLeft = root.querySelector(".RaySiteUI-scrollBtn.left");
        const btnRight = root.querySelector(".RaySiteUI-scrollBtn.right");

        if (!area || !btnLeft || !btnRight) return;

        function updateButtons() {
            const maxScroll = area.scrollWidth - area.clientWidth;
            btnLeft.style.display = area.scrollLeft > 0 ? "block" : "none";
            btnRight.style.display = area.scrollLeft < maxScroll ? "block" : "none";
        }

        btnLeft.addEventListener("click", () => {
            area.scrollBy({ left: -1 * area.clientWidth, behavior: "smooth" });
        });

        btnRight.addEventListener("click", () => {
            area.scrollBy({ left: area.clientWidth, behavior: "smooth" });
        });

        area.addEventListener("scroll", updateButtons);
        window.addEventListener("resize", updateButtons);

        updateButtons();
    }

    document.querySelectorAll(".RaySiteUI-scrollWrap").forEach(initScrollSnap);
})();
</script>

</body>
</html>
