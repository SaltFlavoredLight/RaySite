                entryElement[1];

            // =================================================

                dataArray;

            // =================================================

                1,
                Number(
                    elementSetting.nestLimit
                ) || 1
            );

            // =================================================
            // EXTRA FIELD SCHEMA
            // =================================================

            this.extraFields =
                Array.isArray(
                    elementSetting.extraFields
                )
                    ? elementSetting.extraFields
                    : [];

            // =================================================
            // NORMALIZE FIELD SCHEMA
            // =================================================

            this.extraFields =
                this.extraFields.map(
                    field => ({
                        label:
                            field.label ??
                            "",

                        type:

                            ),

                        default:

                        optional:

                    })
                );

            // =================================================
            // WORKING TREE
            // =================================================

            this.workingArray =
                this.cloneTree(
                    Array.isArray(dataArray)
                        ? dataArray
                        : (
                            Array.isArray(
                                elementSetting.default
                            )
                                ? elementSetting.default
                                : []
                        )
                );

            this.ensureIds(
                this.workingArray
            );

            // =================================================

            // =================================================

                "button";

                "advance-add-button";

                addButton

            this.rootElement.appendChild(
                addArea
            );

            // =================================================
            // TABLE CONTAINER
            // =================================================

            this.tableElement =
                document.createElement(
                    "div"
                );

            this.tableElement.className =
                "advance-table";

            this.rootElement.appendChild(
                this.tableElement
            );

            // =================================================
            // HEADER
            // =================================================

            this.createHeader();

            // =================================================
            // ROOT LIST
            // =================================================

            this.rootList =
                document.createElement(
                    "div"
                );

            this.rootList.className =
                "advance-list";

            this.rootList.dataset.depth =
                "1";

            this.tableElement.appendChild(
                this.rootList
            );

            // =================================================
            // ADD ROOT ITEM
            // =================================================

            const addRootItem =
                () => {
                    const value =
                        this.addInput.value.trim();

                    if (!value) {
                        return;
                    }

                    const newItem =
                        this.createDefaultItem(
                            value
                        );

                    this.workingArray.push(
                        newItem
                    );

                    this.addInput.value =
                        "";

                    this.renderTree();

                    this.addInput.focus();

                    this.updatePreview();
                };

            addButton.addEventListener(
                "click",
                addRootItem
            );

            this.addInput.addEventListener(
                "keydown",
                event => {
                    if (
                        event.key ===
                        "Enter"
                    ) {
                        event.preventDefault();

                        addRootItem();
                    }
                }
            );

            // =================================================
            // INITIAL RENDER
            // =================================================

            this.renderTree();
        }

        // =====================================================
        // RESULT
        // =====================================================

        initResult() {
            return {
                code: 0
            };
        }

        // =====================================================
        // FIELD TYPE
        // =====================================================

        normalizeFieldType(type) {
            const value =
                String(
                    type ?? "text"
                ).toLowerCase();

            if (
                value === "integer"
            ) {
                return "integer";
            }

            if (
                value === "checkmark" ||
                value === "checkbox" ||
                value === "check"
            ) {
                return "checkmark";
            }

            return "text";
        }

        // =====================================================
        // DEFAULT VALUE
        // =====================================================

        getDefaultFieldValue(
            field
        ) {
            if (
                field.default !==
                undefined
            ) {
                return this.normalizeFieldValue(
                    field,
                    field.default
                );
            }

            switch (
                field.type
            ) {
                case "integer":
                    return 0;

                case "checkmark":
                    return false;

                default:
                    return "";
            }
        }

        // =====================================================
        // NORMALIZE FIELD VALUE
        // =====================================================

        normalizeFieldValue(
            field,
            value
        ) {
            switch (
                field.type
            ) {
                case "integer": {
                    if (
                        value === "" ||
                        value === null ||
                        value === undefined
                    ) {
                        return 0;
                    }

                    const number =
                        Number(value);

                    return Number.isFinite(
                        number
                    )
                        ? Math.trunc(
                            number
                        )
                        : 0;
                }

                case "checkmark":
                    return Boolean(
                        value
                    );

                case "text":
                default:
                    return (
                        value === null ||
                        value === undefined
                            ? ""
                            : String(
                                value
                            )
                    );
            }
        }

        // =====================================================
        // CREATE DEFAULT ITEM
        // =====================================================

        createDefaultItem(
            name
        ) {
            const item = {
                name: String(name),
                children: []
            };

            this.extraFields.forEach(
                field => {
                    item[field.label] =
                        this.getDefaultFieldValue(
                            field
                        );
                }
            );

            item.__advanceId =
                this.createId();

            return item;
        }

        // =====================================================
        // CLONE TREE
        // =====================================================

        cloneTree(array) {
            if (!Array.isArray(array)) {
                return [];
            }

            return array.map(
                item => {
                    if (
                        item &&
                        typeof item ===
                            "object"
                    ) {
                        const result = {
                            ...item,

                            name:
                                item.name ??
                                item.label ??
                                "",

                            children:
                                this.cloneTree(
                                    Array.isArray(
                                        item.children
                                    )
                                        ? item.children
                                        : []
                                )
                        };

                        // ---------------------------------
                        // Ensure extra fields exist.
                        // ---------------------------------

                        this.extraFields
                            .forEach(
                                field => {
                                    if (
                                        result[
                                            field.label
                                        ] ===
                                        undefined
                                    ) {
                                        result[
                                            field.label
                                        ] =
                                            this.getDefaultFieldValue(
                                                field
                                            );
                                    } else {
                                        result[
                                            field.label
                                        ] =
                                            this.normalizeFieldValue(
                                                field,
                                                result[
                                                    field.label
                                                ]
                                            );
                                    }
                                }
                            );

                        return result;
                    }

                    return this.createDefaultItem(
                        String(item)
                    );
                }
            );
        }

        // =====================================================
        // IDS
        // =====================================================

        ensureIds(array) {
            if (!Array.isArray(array)) {
                return;
            }

            array.forEach(
                item => {
                    if (
                        !item.__advanceId
                    ) {
                        item.__advanceId =
                            this.createId();
                    }

                    if (
                        Array.isArray(
                            item.children
                        )
                    ) {
                        this.ensureIds(
                            item.children
                        );
                    }
                }
            );
        }

        createId() {
            return (
                "advance_" +
                Date.now().toString(36) +
                "_" +
                Math.random()
                    .toString(36)
                    .slice(2, 10)
            );
        }

        // =====================================================
        // HEADER
        // =====================================================

        createHeader() {
            const message = document.createElement("div");
            message.classList.add("advance-nest-space-text");
            message.style.fontSize = "14px"
            message.textContent = "(Hint: you can drag the element to the bottom of the other element for nesting)"
            this.tableElement.appendChild(message)

            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "advance-header";

            const columns = [
                "Name",
                ...this.extraFields.map(
                    field =>
                        field.label
                ),
                ""
            ];

            header.style.gridTemplateColumns =
                this.getGridColumns();

            columns.forEach(
                label => {
                    const cell =
                        document.createElement(
                            "div"
                        );

                    cell.className =
                        "advance-header-cell";

                    cell.textContent =
                        label;

                    header.appendChild(
                        cell
                    );
                }
            );

            this.tableElement.appendChild(
                header
            );
        }

        // =====================================================
        // GRID
        // =====================================================

        getGridColumns() {
            /*
             * Name gets the remaining
             * space.
             *
             * Extra fields use a reasonable
             * fixed minimum.
             *
             * Last column is remove button.
             */

            const fields =
                this.extraFields.length;

            if (fields === 0) {
                return "minmax(0, 1fr) 36px";
            }

            return (
                "minmax(180px, 1fr) " +
                Array(
                    fields
                )
                    .fill(
                        "minmax(90px, 0.35fr)"
                    )
                    .join(" ") +
                " 36px"
            );
        }

        // =====================================================
        // PREVIEW
        // =====================================================

        updatePreview() {
            this.previewTreeElement.innerHTML =
                "";

            this.renderPreviewLevel(
                this.workingArray,
                this.previewTreeElement,
                1
            );
        }

        renderPreviewLevel(
            array,
            container,
            depth
        ) {
            if (!Array.isArray(array)) {
                return;
            }

            array.forEach(
                item => {
                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "advance-preview-item";

                    row.style.paddingLeft =
                        (
                            (depth - 1) *
                            20
                        ) + "px";

                    row.textContent =
                        String(
                            item.name ?? ""
                        );

                    container.appendChild(
                        row
                    );

                    if (
                        Array.isArray(
                            item.children
                        ) &&
                        item.children.length
                    ) {
                        this.renderPreviewLevel(
                            item.children,
                            container,
                            depth + 1
                        );
                    }
                }
            );
        }

        // =====================================================
        // RENDER TREE
        // =====================================================

        renderTree() {
            this.destroySortables();

            this.rootList.innerHTML =
                "";

            this.ensureIds(
                this.workingArray
            );

            this.renderLevel(
                this.workingArray,
                this.rootList,
                1
            );

            this.updatePreview();
        }

        // =====================================================
        // RENDER LEVEL
        // =====================================================

        renderLevel(
            array,
            listElement,
            depth
        ) {
            listElement.dataset.depth =
                String(depth);

            array.forEach(
                item => {
                    const element =
                        this.createItem(
                            item,
                            array,
                            depth
                        );

                    listElement.appendChild(
                        element
                    );
                }
            );

            this.createSortable(
                listElement
            );
        }

        // =====================================================
        // CREATE ITEM
        // =====================================================

        createItem(
            item,
            parentArray,
            depth
        ) {
            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "advance-item";

            wrapper.dataset.advanceId =
                item.__advanceId;

            wrapper.dataset.depth =
                String(depth);

            // =================================================
            // ROW
            // =================================================

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "advance-item-row";

            row.style.gridTemplateColumns =
                this.getGridColumns();

            // =================================================
            // NAME
            // =================================================

            const nameCell =
                document.createElement(
                    "div"
                );

            nameCell.className =
                "advance-name-cell";

            const handle =
                document.createElement(
                    "span"
                );

            handle.className =
                "advance-handle";

            handle.textContent =
                "☷";

            const nameInput =
                document.createElement(
                    "input"
                );

            nameInput.type =
                "text";

            nameInput.className =
                "advance-item-input";

            nameInput.value =
                item.name ?? "";

            nameInput.addEventListener(
                "input",
                () => {
                    item.name =
                        nameInput.value;

                    this.updatePreview();
                }
            );

            nameCell.appendChild(
                handle
            );

            nameCell.appendChild(
                nameInput
            );

            row.appendChild(
                nameCell
            );

            // =================================================
            // EXTRA FIELDS
            // =================================================

            this.extraFields.forEach(
                field => {
                    const cell =
                        document.createElement(
                            "div"
                        );

                    cell.className =
                        "advance-cell";

                    const input =
                        this.createFieldInput(
                            field,
                            item
                        );

                    cell.appendChild(
                        input
                    );

                    row.appendChild(
                        cell
                    );
                }
            );

            // =================================================
            // REMOVE
            // =================================================

            const removeCell =
                document.createElement(
                    "div"
                );

            removeCell.className =
                "advance-cell";

            const remove =
                document.createElement(
                    "button"
                );

            remove.type =
                "button";

            remove.className =
                "advance-remove";

            remove.textContent =
                "×";

            remove.addEventListener(
                "click",
                event => {
                    event.preventDefault();
                    event.stopPropagation();

                    const index =
                        parentArray.indexOf(
                            item
                        );

                    if (
                        index !== -1
                    ) {
                        parentArray.splice(
                            index,
                            1
                        );
                    }

                    this.renderTree();
                }
            );

            removeCell.appendChild(
                remove
            );

            row.appendChild(
                removeCell
            );

            wrapper.appendChild(
                row
            );

            // =================================================
            // CHILDREN
            // =================================================

            if (
                depth <
                this.nestLimit
            ) {
                if (
                    !Array.isArray(
                        item.children
                    )
                ) {
                    item.children = [];
                }

                const childrenArea =
                    document.createElement(
                        "div"
                    );

                childrenArea.className =
                    "advance-children";

                // ---------------------------------------------
                // CHILD LIST
                // ---------------------------------------------

                const childList =
                    document.createElement(
                        "div"
                    );

                childList.className =
                    "advance-list";

                childList.dataset.depth =
                    String(
                        depth + 1
                    );

                this.renderLevel(
                    item.children,
                    childList,
                    depth + 1
                );

                childrenArea.appendChild(
                    childList
                );

                // ---------------------------------------------
                // NEST SPACE
                // ---------------------------------------------
                /*
                const nestSpace =
                    document.createElement(
                        "div"
                    );

                nestSpace.className =
                    "advance-nest-space";

                nestSpace.dataset.ownerId =
                    item.__advanceId;


            
                const nestText =
                    document.createElement(
                        "span"
                    );

                nestText.className =
                    "advance-nest-space-text";

                nestText.textContent =
                    "drag element here for nesting";

                nestSpace.appendChild(
                    nestText
                );

                childrenArea.appendChild(
                    nestSpace
                );
                */

                wrapper.appendChild(
                    childrenArea
                );
            }

            return wrapper;
        }

        // =====================================================
        // FIELD INPUT
        // =====================================================

        createFieldInput(
            field,
            item
        ) {
            let input;

            switch (
                field.type
            ) {
                case "integer":
                    input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "number";

                    input.step =
                        "1";

                    input.className =
                        "advance-field-input";

                    input.value =
                        item[
                            field.label
                        ] ?? 0;

                    input.addEventListener(
                        "input",
                        () => {
                            item[
                                field.label
                            ] =
                                this.normalizeFieldValue(
                                    field,
                                    input.value
                                );
                        }
                    );

                    break;

                case "checkmark":
                    input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "checkbox";

                    input.className =
                        "advance-field-checkbox";

                    input.checked =
                        Boolean(
                            item[
                                field.label
                            ]
                        );

                    input.addEventListener(
                        "change",
                        () => {
                            item[
                                field.label
                            ] =
                                input.checked;
                        }
                    );

                    break;

                case "text":
                default:
                    input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "text";

                    input.className =
                        "advance-field-input";

                    input.value =
                        item[
                            field.label
                        ] ?? "";

                    input.addEventListener(
                        "input",
                        () => {
                            item[
                                field.label
                            ] =
                                input.value;
                        }
                    );

                    break;
            }

            // -------------------------------------------------
            // OPTIONAL
            // -------------------------------------------------
            //
            // For optional fields we allow an empty value.
            // For required fields we don't remove the field
            // from the object.
            //
            // The schema itself controls whether the field
            // must exist.
            // -------------------------------------------------

            if (
                field.optional === false
            ) {
                input.dataset.required =
                    "true";
            }

            return input;
        }

        // =====================================================
        // SORTABLE
        // =====================================================

        createSortable(
            listElement
        ) {
            if (
                typeof Sortable ===
                "undefined"
            ) {
                return;
            }

            const sortable =
                new Sortable(
                    listElement,
                    {
                        animation: 180,

                        direction:
                            "vertical",

                        draggable:
                            ".advance-item",

                        handle:
                            ".advance-handle",

                        ghostClass:
                            "advance-ghost",

                        chosenClass:
                            "advance-chosen",

                        dragClass:
                            "advance-drag",

                        fallbackOnBody:
                            true,

                        swapThreshold:
                            0.65,

                        emptyInsertThreshold:
                            20,

                        group: {
                            name:
                                "advance-tree",

                            pull: true,

                            put: true
                        },

                        // =====================================
                        // START
                        // =====================================

                        onStart:
                            event => {
                                this.draggedElement =
                                    event.item;

                                this.showValidNestSpaces(
                                    event.item
                                );
                            },

                        // =====================================
                        // MOVE
                        // =====================================

                        onMove:
                            event => {
                                return this.handleMove(
                                    event
                                );
                            },

                        // =====================================
                        // END
                        // =====================================

                        onEnd:
                            event => {
                                this.hideNestSpaces();

                                this.draggedElement =
                                    null;

                                this.rebuildTreeFromDOM();

                                this.updatePreview();
                            }
                    }
                );

            this.sortables.push(
                sortable
            );
        }

        // =====================================================
        // ON MOVE
        // =====================================================

        handleMove(
            event
        ) {
            const dragged =
                event.dragged;

            const destination =
                event.to;

            if (
                !dragged ||
                !destination
            ) {
                return false;
            }

            // -------------------------------------------------
            // Can't move into itself.
            // -------------------------------------------------

            if (
                dragged ===
                destination
            ) {
                return false;
            }

            // -------------------------------------------------
            // Can't move into own descendants.
            // -------------------------------------------------

            if (
                dragged.contains(
                    destination
                )
            ) {
                return false;
            }

            // -------------------------------------------------
            // Destination depth.
            // -------------------------------------------------

            const destinationDepth =
                this.getListDepth(
                    destination
                );

            // -------------------------------------------------
            // Height of entire dragged subtree.
            // -------------------------------------------------

            const subtreeDepth =
                this.getDOMSubtreeDepth(
                    dragged
                );

            // -------------------------------------------------
            // Resulting deepest level.
            // -------------------------------------------------

            const deepestLevel =
                destinationDepth +
                subtreeDepth -
                1;

            // -------------------------------------------------
            // NEST LIMIT.
            // -------------------------------------------------

            if (
                deepestLevel >
                this.nestLimit
            ) {
                return false;
            }

            // -------------------------------------------------
            // Make sure destination isn't
            // actually inside dragged subtree.
            // -------------------------------------------------

            const owner =
                destination.closest(
                    ".advance-item"
                );

            if (
                owner &&
                owner ===
                    dragged
            ) {
                return false;
            }

            return true;
        }

        // =====================================================
        // LIST DEPTH
        // =====================================================

        getListDepth(
            list
        ) {
            const depth =
                Number(
                    list.dataset.depth
                );

            return Number.isFinite(
                depth
            )
                ? depth
                : 1;
        }

        // =====================================================
        // DOM SUBTREE DEPTH
        // =====================================================

        getDOMSubtreeDepth(
            element
        ) {
            const rootDepth =
                Number(
                    element.dataset.depth
                ) || 1;

            let maximum =
                rootDepth;

            const descendants =
                element.querySelectorAll(
                    ".advance-item"
                );

            descendants.forEach(
                child => {
                    const depth =
                        Number(
                            child.dataset.depth
                        );

                    if (
                        Number.isFinite(
                            depth
                        )
                    ) {
                        maximum =
                            Math.max(
                                maximum,
                                depth
                            );
                    }
                }
            );

            return (
                maximum -
                rootDepth +
                1
            );
        }

        // =====================================================
        // NEST SPACE VISIBILITY
        // =====================================================

        showValidNestSpaces(
            dragged
        ) {
            const spaces =
                this.popupElement.querySelectorAll(
                    ".advance-nest-space"
                );

            const subtreeDepth =
                this.getDOMSubtreeDepth(
                    dragged
                );

            spaces.forEach(
                space => {
                    const ownerId =
                        space.dataset
                            .ownerId;

                    // Never allow nesting into
                    // the dragged item itself.

                    if (
                        ownerId ===
                        dragged.dataset
                            .advanceId
                    ) {
                        space.style.display =
                            "none";

                        return;
                    }

                    const childList =
                        space.previousElementSibling;

                    if (
                        !childList
                    ) {
                        return;
                    }

                    const destinationDepth =
                        this.getListDepth(
                            childList
                        );

                    const resultingDepth =
                        destinationDepth +
                        subtreeDepth -
                        1;

                    if (
                        resultingDepth <=
                        this.nestLimit
                    ) {
                        space.style.display =
                            "flex";
                    } else {
                        space.style.display =
                            "none";
                    }
                }
            );
        }

        hideNestSpaces() {
            const spaces =
                this.popupElement.querySelectorAll(
                    ".advance-nest-space"
                );

            spaces.forEach(
                space => {
                    space.style.display =
                        "flex";
                }
            );
        }

        // =====================================================
        // REBUILD TREE
        // =====================================================

        rebuildTreeFromDOM() {
            const oldTree =
                this.workingArray;

            const readList =
                listElement => {
                    const result = [];

                    Array.from(
                        listElement.children
                    ).forEach(
                        element => {
                            if (
                                !element.classList.contains(
                                    "advance-item"
                                )
                            ) {
                                return;
                            }

                            const id =
                                element.dataset
                                    .advanceId;

                            const oldItem =
                                this.findById(
                                    oldTree,
                                    id
                                );

                            const item =
                                oldItem
                                    ? {
                                        ...oldItem
                                    }
                                    : this.createDefaultItem(
                                        ""
                                    );

                            item.__advanceId =
                                id;

                            // ---------------------------------
                            // NAME
                            // ---------------------------------

                            const nameInput =
                                element.querySelector(
                                    ":scope > .advance-item-row > .advance-name-cell > .advance-item-input"
                                );

                            item.name =
                                nameInput
                                    ? nameInput.value
                                    : "";

                            // ---------------------------------
                            // EXTRA FIELDS
                            // ---------------------------------

                            const row =
                                element.querySelector(
                                    ":scope > .advance-item-row"
                                );

                            if (row) {
                                const cells =
                                    Array.from(
                                        row.children
                                    );

                                // Cell 0 = name.
                                // Last cell = remove.
                                //
                                // Extra fields are
                                // between them.

                                this.extraFields.forEach(
                                    (
                                        field,
                                        fieldIndex
                                    ) => {
                                        const cell =
                                            cells[
                                                fieldIndex +
                                                    1
                                            ];

                                        if (
                                            !cell
                                        ) {
                                            return;
                                        }

                                        const input =
                                            cell.querySelector(
                                                "input"
                                            );

                                        if (
                                            !input
                                        ) {
                                            return;
                                        }

                                        if (
                                            field.type ===
                                            "checkmark"
                                        ) {
                                            item[
                                                field.label
                                            ] =
                                                input.checked;
                                        } else {
                                            item[
                                                field.label
                                            ] =
                                                this.normalizeFieldValue(
                                                    field,
                                                    input.value
                                                );
                                        }
                                    }
                                );
                            }

                            // ---------------------------------
                            // CHILDREN
                            // ---------------------------------

                            const childList =
                                element.querySelector(
                                    ":scope > .advance-children > .advance-list"
                                );

                            if (
                                childList
                            ) {
                                item.children =
                                    readList(
                                        childList
                                    );
                            } else {
                                item.children =
                                    [];
                            }

                            result.push(
                                item
                            );
                        }
                    );

                    return result;
                };

            this.workingArray =
                readList(
                    this.rootList
                );
        }

        // =====================================================
        // FIND BY ID
        // =====================================================

        findById(
            array,
            id
        ) {
            if (
                !Array.isArray(
                    array
                )
            ) {
                return null;
            }

            for (
                const item of array
            ) {
                if (
                    item &&
                    item.__advanceId ===
                        id
                ) {
                    return item;
                }

                if (
                    item &&
                    Array.isArray(
                        item.children
                    )
                ) {
                    const found =
                        this.findById(
                            item.children,
                            id
                        );

                    if (found) {
                        return found;
                    }
                }
            }

            return null;
        }

        // =====================================================
        // DESTROY SORTABLE
        // =====================================================

        destroySortables() {
            if (
                !Array.isArray(
                    this.sortables
                )
            ) {
                this.sortables =
                    [];

                return;
            }

            this.sortables.forEach(
                sortable => {
                    if (
                        sortable &&
                        typeof sortable.destroy ===
                            "function"
                    ) {
                        sortable.destroy();
                    }
                }
            );

            this.sortables =
                [];
        }

        // =====================================================
        // CLEAN DATA
        // =====================================================

        cleanTree(
            array
        ) {
            if (
                !Array.isArray(
                    array
                )
            ) {
                return [];
            }

            return array.map(
                item => {
                    const result = {};

                    Object.keys(
                        item
                    ).forEach(
                        key => {
                            if (
                                key !==
                                "__advanceId"
                            ) {
                                result[key] =
                                    item[key];
                            }
                        }
                    );

                    result.children =
                        this.cleanTree(
                            Array.isArray(
                                item.children
                            )
                                ? item.children
                                : []
                        );

                    return result;
                }
            );
        }

        // =====================================================
        // POPUP CLOSE
        // =====================================================

        onPopupClose() {
            this.hideNestSpaces();

            this.updatePreview();
        }

        // =====================================================
        // SAVE
        // =====================================================

        onSave() {
            // -----------------------------------------------
            // Destroy ALL Sortable instances.
            // -----------------------------------------------

            this.destroySortables();

            this.draggedElement =
                null;

            // -----------------------------------------------
            // Clean internal IDs.
            // -----------------------------------------------

            const cleanData =
                this.cleanTree(
                    this.workingArray
                );

            // -----------------------------------------------
            // Commit to existing Proxy.
            // -----------------------------------------------

            if (
                Array.isArray(
                    this.originalDataArray
                )
            ) {
                this.originalDataArray.splice(
                    0,
                    this.originalDataArray.length,
                    ...cleanData
                );

                return this.originalDataArray;
            }

            return cleanData;
        }
    },

    // =========================================================
    // CANVAS RENDER
    // =========================================================

    render: function(
        dataArray
    ) {
        if (
            !Array.isArray(
                dataArray
            )
        ) {
            return "";
        }

        const result = [];

        const flatten =
            array => {
                array.forEach(
                    item => {
                        if (!item) {
                            return;
                        }

                        result.push(
                            String(
                                item.name ??
                                item.label ??
                                ""
                            )
                        );

                        if (
                            Array.isArray(
                                item.children
                            )
                        ) {
                            flatten(
                                item.children
                            );
                        }
                    }
                );
            };

        flatten(dataArray);

        return result.join(
            ", "
        );
    }
}

function applyCSSStyles(componentDefinition) {
    const styleElement = document.getElementById("demytric");

    if (!styleElement) {
        throw new Error(
            'Style element with id="demytric" was not found.'
        );
    }

    const sheet = styleElement.sheet;

    if (!sheet) {
        throw new Error("The stylesheet is not available.");
    }

    // Clear existing rules
    while (sheet.cssRules.length > 0) {
        sheet.deleteRule(0);
    }

    const cssStyles = componentDefinition.cssStyles || [];

    cssStyles.forEach((style) => {
        const selector = style.object;
        const declarations = (style.info || [])
            .map(({ key, value }) => `${key}: ${value};`)
            .join(" ");

        if (!selector || !declarations) {
            return;
        }

        const rule = `${selector} { ${declarations} }`;

        sheet.insertRule(
            rule,
            sheet.cssRules.length
        );
    });
}
