			body {
				font-family: Arial, sans-serif;
				padding: 30px;
			}

			.preview {
				border: 1px solid #ccc;
				padding: 15px;
				margin-bottom: 20px;
			}

			.popup {
				border: 1px solid #ccc;
				padding: 20px;
				width: 400px;
			}

			.sort-list-add {
				display: flex;
				gap: 8px;
				margin-bottom: 15px;
			}

			.sort-list-input {
				flex: 1;
				padding: 8px;
			}

			.sort-list-add-button {
				padding: 8px 15px;
			}

			.sort-list-container {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}

			.sort-list-item {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 10px;
				border: 1px solid #ddd;
				background: #fafafa;
			}

			.sort-list-handle {
				cursor: grab;
				font-size: 20px;
			}

			.sort-list-text {
				flex: 1;
			}

			.sort-list-remove {
				border: none;
				background: transparent;
				font-size: 20px;
				cursor: pointer;
			}

			.sort-list-ghost {
				opacity: 0.4;
			}

			.save {
				margin-top: 20px;
				padding: 10px 20px;
			}

			pre {
				background: #f5f5f5;
				padding: 15px;
			}

    component: class {

        constructor(
            dataArray,
            entryElement,
            elementSetting
        ) {

            // =================================================
            // BASIC REFERENCES
            // =================================================

            this.previewElement = entryElement[0];
            this.popupElement = entryElement[1];
            this.elementSetting = elementSetting;


            // =================================================
            // ORIGINAL DATA
            // =================================================

            /*
             * This can be your Proxy.
             *
             * NEVER edit this directly while the popup
             * is being edited.
             */

            this.originalDataArray = dataArray;


            // =================================================
            // EXTRA FIELDS
            // =================================================

            this.extraFields =
                Array.isArray(
                    elementSetting.extraFields
                )
                    ? elementSetting.extraFields.map(
                        field => ({
                            label: field.label ?? "",
                            type: this.normalizeFieldType(
                                field.type
                            ),
                            default: field.default,
                            optional:
                                field.optional === true
                        })
                    )
                    : [];


            // =================================================
            // WORKING ARRAY
            // =================================================

            const sourceArray =
                Array.isArray(dataArray)
                    ? dataArray
                    : (
                        Array.isArray(
                            elementSetting.default
                        )
                            ? elementSetting.default
                            : []
                    );


            /*
             * Create separate objects.
             *
             * The popup works ONLY with this array.
             */

            this.workingArray =
                sourceArray.map(
                    item => this.cloneItem(item)
                );


            // =================================================
            // SORTABLE
            // =================================================

            this.sortable = null;


            // =================================================
            // PREVIEW
            // =================================================

            this.previewElement.innerHTML = "";

            this.previewText =
                document.createElement("p");

            this.previewElement.appendChild(
                this.previewText
            );


            // =================================================
            // POPUP ROOT
            // =================================================

            this.popupElement.innerHTML = "";

            this.rootElement =
                document.createElement("div");

            this.rootElement.className =
                "sort-list-root";

            this.popupElement.appendChild(
                this.rootElement
            );


            // =================================================
            // ADD AREA
            // =================================================

            const addArea =
                document.createElement("div");

            addArea.className =
                "sort-list-add";


            this.addInput =
                document.createElement("input");

            this.addInput.type =
                "text";

            this.addInput.className =
                "sort-list-input";

            this.addInput.placeholder =
                "Add list element...";


            const addButton =
                document.createElement("button");

            addButton.type =
                "button";

            addButton.className =
                "sort-list-add-button";

            addButton.textContent =
                "Add";


            addArea.appendChild(
                this.addInput
            );

            addArea.appendChild(
                addButton
            );

            this.rootElement.appendChild(
                addArea
            );


            // =================================================
            // HEADER
            // =================================================

            this.headerElement =
                document.createElement("div");

            this.headerElement.className =
                "sort-list-header";


            // Drag header

            this.headerElement.appendChild(
                this.createHeaderCell(
                    "",
                    "sort-list-drag"
                )
            );


            // Name header

            this.headerElement.appendChild(
                this.createHeaderCell(
                    "Name",
                    "sort-list-name"
                )
            );


            // Extra headers

            this.extraFields.forEach(
                field => {

                    let label =
                        field.label;

                    if (field.optional) {
                        label += " (optional)";
                    }

                    this.headerElement.appendChild(
                        this.createHeaderCell(
                            label,
                            this.getFieldClass(
                                field
                            )
                        )
                    );
                }
            );


            // Delete header

            this.headerElement.appendChild(
                this.createHeaderCell(
                    "Delete",
                    "sort-list-delete"
                )
            );


            this.rootElement.appendChild(
                this.headerElement
            );


            // =================================================
            // LIST
            // =================================================

            this.listElement =
                document.createElement("div");

            this.listElement.className =
                "sort-list-list";

            this.rootElement.appendChild(
                this.listElement
            );


            // =================================================
            // ADD HANDLERS
            // =================================================

            const addItem = () => {

                const value =
                    this.addInput.value.trim();

                if (!value) {
                    return;
                }


                const item =
                    this.createDefaultItem(
                        value
                    );


                /*
                 * Add to working data.
                 */

                this.workingArray.push(
                    item
                );


                /*
                 * IMPORTANT:
                 *
                 * Do NOT render the whole list.
                 *
                 * Just create one new row.
                 */

                const row =
                    this.createRow(
                        item
                    );

                this.listElement.appendChild(
                    row
                );


                this.addInput.value = "";

                this.addInput.focus();


                this.updatePreview();
            };


            addButton.addEventListener(
                "click",
                addItem
            );


            this.addInput.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        event.preventDefault();

                        addItem();
                    }
                }
            );


            // =================================================
            // INITIAL BUILD
            // =================================================

            /*
             * This is the ONLY full construction.
             */

            this.renderListOnce();


            // =================================================
            // PREVIEW
            // =================================================

            this.updatePreview();
        }


        // =================================================
        // FIELD TYPE
        // =================================================

        normalizeFieldType(type) {

            const value =
                String(
                    type ?? "text"
                ).toLowerCase();


            if (
                value === "integer"
            ) {
                return "integer";
            }


            if (
                value === "checkmark" ||
                value === "checkbox" ||
                value === "check"
            ) {
                return "checkmark";
            }


            return "text";
        }


        // =================================================
        // DEFAULT FIELD VALUE
        // =================================================

        getDefaultFieldValue(field) {

            if (
                field.default !==
                undefined
            ) {

                return this.normalizeFieldValue(
                    field,
                    field.default
                );
            }


            switch (field.type) {

                case "integer":
                    return 0;

                case "checkmark":
                    return false;

                case "text":
                default:
                    return "";
            }
        }


        // =================================================
        // NORMALIZE FIELD VALUE
        // =================================================

        normalizeFieldValue(
            field,
            value
        ) {

            switch (field.type) {

                case "integer": {

                    if (
                        value === "" ||
                        value === null ||
                        value === undefined
                    ) {

                        return 0;
                    }


                    const number =
                        Number(value);


                    return Number.isFinite(
                        number
                    )
                        ? Math.trunc(number)
                        : 0;
                }


                case "checkmark":

                    return Boolean(
                        value
                    );


                case "text":
                default:

                    return (
                        value === null ||
                        value === undefined
                    )
                        ? ""
                        : String(value);
            }
        }


        // =================================================
        // CLONE ITEM
        // =================================================

        cloneItem(item) {

            /*
             * Existing object
             */

            if (
                item &&
                typeof item === "object" &&
                !Array.isArray(item)
            ) {

                const result = {
                    ...item
                };


                result.name =
                    result.name ??
                    "";


                this.extraFields.forEach(
                    field => {

                        if (
                            result[field.label] ===
                            undefined
                        ) {

                            result[field.label] =
                                this.getDefaultFieldValue(
                                    field
                                );

                        } else {

                            result[field.label] =
                                this.normalizeFieldValue(
                                    field,
                                    result[field.label]
                                );
                        }
                    }
                );


                return result;
            }


            /*
             * Primitive item
             */

            const result = {
                name:
                    item === null ||
                    item === undefined
                        ? ""
                        : String(item)
            };


            this.extraFields.forEach(
                field => {

                    result[field.label] =
                        this.getDefaultFieldValue(
                            field
                        );
                }
            );


            return result;
        }


        // =================================================
        // CREATE DEFAULT ITEM
        // =================================================

        createDefaultItem(
            name
        ) {

            const item = {
                name: String(name)
            };


            this.extraFields.forEach(
                field => {

                    item[field.label] =
                        this.getDefaultFieldValue(
                            field
                        );
                }
            );


            return item;
        }


        // =================================================
        // FIELD CLASS
        // =================================================

        getFieldClass(field) {

            switch (field.type) {

                case "text":
                    return "sort-list-field-text";

                case "integer":
                    return "sort-list-field-integer";

                case "checkmark":
                    return "sort-list-field-checkmark";

                default:
                    return "sort-list-field-text";
            }
        }


        // =================================================
        // HEADER CELL
        // =================================================

        createHeaderCell(
            text,
            className
        ) {

            const element =
                document.createElement("div");

            element.className =
                className;

            element.textContent =
                text;

            return element;
        }


        // =================================================
        // CREATE FIELD INPUT
        // =================================================

        createFieldInput(
            field,
            item
        ) {

            let input;


            switch (field.type) {

                // -----------------------------------------
                // INTEGER
                // -----------------------------------------

                case "integer": {

                    input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "number";

                    input.step =
                        "1";

                    input.className =
                        "sort-list-field-input";


                    input.value =
                        item[field.label] ?? "";


                    /*
                     * IMPORTANT:
                     *
                     * Only modify the item.
                     *
                     * Do NOT rebuild anything.
                     */

                    input.addEventListener(
                        "input",
                        () => {

                            if (
                                input.value ===
                                ""
                            ) {

                                if (
                                    field.optional
                                ) {

                                    item[field.label] =
                                        "";

                                } else {

                                    item[field.label] =
                                        this.getDefaultFieldValue(
                                            field
                                        );
                                }

                                return;
                            }


                            item[field.label] =
                                this.normalizeFieldValue(
                                    field,
                                    input.value
                                );
                        }
                    );


                    break;
                }


                // -----------------------------------------
                // CHECKMARK
                // -----------------------------------------

                case "checkmark": {

                    input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "checkbox";

                    input.className =
                        "sort-list-field-checkbox";

                    input.checked =
                        Boolean(
                            item[field.label]
                        );


                    input.addEventListener(
                        "change",
                        () => {

                            item[field.label] =
                                input.checked;
                        }
                    );


                    return input;
                }


                // -----------------------------------------
                // TEXT
                // -----------------------------------------

                case "text":

                default: {

                    input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "text";

                    input.className =
                        "sort-list-field-input";


                    input.value =
                        item[field.label] ?? "";


                    input.addEventListener(
                        "input",
                        () => {

                            item[field.label] =
                                input.value;
                        }
                    );


                    break;
                }
            }


            if (
                field.optional ===
                false
            ) {

                input.dataset.required =
                    "true";
            }


            return input;
        }


        // =================================================
        // CREATE ONE ROW
        // =================================================

        createRow(item) {

            const row =
                document.createElement("div");

            row.className =
                "sort-list-row";


            /*
             * Keep direct reference to the
             * corresponding working item.
             */

            row._sortListItem =
                item;


            // =================================================
            // DRAG COLUMN
            // =================================================

            const dragCell =
                document.createElement("div");

            dragCell.className =
                "sort-list-drag";


            const handle =
                document.createElement("span");

            handle.className =
                "sort-list-handle";

            handle.textContent =
                "☷";


            dragCell.appendChild(
                handle
            );

            row.appendChild(
                dragCell
            );


            // =================================================
            // NAME COLUMN
            // =================================================

            const nameCell =
                document.createElement("div");

            nameCell.className =
                "sort-list-name";


            const nameInput =
                document.createElement("input");

            nameInput.type =
                "text";

            nameInput.className =
                "sort-list-name-input";

            nameInput.value =
                item.name ?? "";


            /*
             * EXACTLY like your successful sample:
             *
             * change the object,
             * do not rebuild the row.
             */

            nameInput.addEventListener(
                "input",
                () => {

                    item.name =
                        nameInput.value;

                    this.updatePreview();
                }
            );


            nameCell.appendChild(
                nameInput
            );

            row.appendChild(
                nameCell
            );


            // =================================================
            // EXTRA FIELDS
            // =================================================

            this.extraFields.forEach(
                field => {

                    const cell =
                        document.createElement(
                            "div"
                        );

                    /*
                     * Same width class as the
                     * header column.
                     */

                    cell.className =
                        this.getFieldClass(
                            field
                        );


                    const input =
                        this.createFieldInput(
                            field,
                            item
                        );


                    cell.appendChild(
                        input
                    );

                    row.appendChild(
                        cell
                    );
                }
            );


            // =================================================
            // DELETE COLUMN
            // =================================================

            const deleteCell =
                document.createElement("div");

            deleteCell.className =
                "sort-list-delete";


            const deleteButton =
                document.createElement("button");

            deleteButton.type =
                "button";

            deleteButton.className =
                "sort-list-remove";

            deleteButton.textContent =
                "×";


            deleteButton.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    /*
                     * Find item by reference.
                     *
                     * This remains correct even
                     * after the list has been sorted.
                     */

                    const index =
                        this.workingArray.indexOf(
                            item
                        );


                    if (
                        index === -1
                    ) {
                        return;
                    }


                    /*
                     * Remove ONE object
                     * from the working data.
                     */

                    this.workingArray.splice(
                        index,
                        1
                    );


                    /*
                     * Remove ONE DOM row.
                     *
                     * No re-render.
                     */

                    row.remove();


                    this.updatePreview();
                }
            );


            deleteCell.appendChild(
                deleteButton
            );

            row.appendChild(
                deleteCell
            );


            return row;
        }


        // =================================================
        // INITIAL LIST BUILD
        // =================================================

        renderListOnce() {

            /*
             * Full DOM construction occurs
             * only here.
             */

            this.listElement.innerHTML = "";


            this.workingArray.forEach(
                item => {

                    this.listElement.appendChild(
                        this.createRow(item)
                    );
                }
            );


            this.createSortable();
        }


        // =================================================
        // CREATE SORTABLE
        // =================================================

        createSortable() {

            if (
                typeof Sortable ===
                "undefined"
            ) {

                return;
            }


            /*
             * IMPORTANT:
             *
             * There is NO filter here.
             *
             * Sorting is activated ONLY from
             * .sort-list-handle.
             *
             * Therefore the input remains a
             * completely normal editable input.
             */

            this.sortable =
                new Sortable(
                    this.listElement,
                    {

                        animation:
                            150,

                        direction:
                            "vertical",

                        draggable:
                            ".sort-list-row",

                        handle:
                            ".sort-list-handle",

                        ghostClass:
                            "sort-list-ghost",

                        /*
                         * Do not use filter:
                         * "input, button"
                         */

                        onEnd:
                            event => {

                                const oldIndex =
                                    event.oldIndex;

                                const newIndex =
                                    event.newIndex;


                                if (
                                    oldIndex ===
                                    undefined ||
                                    newIndex ===
                                    undefined ||
                                    oldIndex ===
                                    newIndex
                                ) {

                                    return;
                                }


                                /*
                                 * Sortable has already
                                 * moved the DOM node.
                                 *
                                 * We only move the
                                 * working data.
                                 */

                                const movedItem =
                                    this.workingArray.splice(
                                        oldIndex,
                                        1
                                    )[0];


                                this.workingArray.splice(
                                    newIndex,
                                    0,
                                    movedItem
                                );


                                /*
                                 * Absolutely NO
                                 * renderListOnce().
                                 */

                                this.updatePreview();
                            }
                    }
                );
        }


        // =================================================
        // PREVIEW
        // =================================================

        updatePreview() {

            /*
             * Only update the preview element.
             *
             * Nothing in the popup is recreated.
             */

            this.previewText.textContent =
                this.workingArray
                    .map(
                        item =>
                            item.name
                    )
                    .join(", ");
        }


        // =================================================
        // POPUP CLOSE
        // =================================================

        onPopupClose() {

            /*
             * Do not commit.
             *
             * Do not rebuild.
             *
             * Do not destroy the inputs.
             */

            this.updatePreview();
        }


        // =================================================
        // SAVE
        // =================================================

        onSave() {

            // ---------------------------------------------
            // Destroy Sortable.
            // ---------------------------------------------

            if (
                this.sortable
            ) {

                this.sortable.destroy();

                this.sortable = null;
            }


            // ---------------------------------------------
            // Commit only now.
            // ---------------------------------------------

            if (
                Array.isArray(
                    this.originalDataArray
                )
            ) {

                this.originalDataArray.splice(
                    0,
                    this.originalDataArray.length,
                    ...this.workingArray
                );


                return this.originalDataArray;
            }


            return this.workingArray;
        }


        // =================================================
        // RESULT
        // =================================================

        initResult() {

            return {
                code: 0
            };
        }
    },


    // =================================================
    // CANVAS PREVIEW
    // =================================================

    render: function(dataArray) {

        if (
            !Array.isArray(dataArray)
        ) {

            return "";
        }


        return dataArray
            .map(
                item => {

                    if (
                        item &&
                        typeof item ===
                            "object" &&
                        !Array.isArray(item)
                    ) {

                        return (
                            item.name ??
                            ""
                        );
                    }


                    return String(
                        item
                    );
                }
            )
            .join(", ");
    }
};

			function applyCSSStyles(componentDefinition) {
				const styleElement = document.getElementById("demytric");
				if (!styleElement) {
					throw new Error('Style element with id="demytric" was not found.');
				}
				const sheet = styleElement.sheet;
				if (!sheet) {
					throw new Error("The stylesheet is not available.");
				}
				// Clear existing rules
				while (sheet.cssRules.length > 0) {
					sheet.deleteRule(0);
				}
				const cssStyles = componentDefinition.cssStyles || [];
				cssStyles.forEach((style) => {
					const selector = style.object;
					const declarations = (style.info || []).map(({
						key,
						value
					}) => `${key}: ${value};`).join(" ");
					if (!selector || !declarations) {
						return;
					}
					const rule = `${selector} { ${declarations} }`;
					sheet.insertRule(rule, sheet.cssRules.length);
				});
			}
			applyCSSStyles(classic);
			/*
