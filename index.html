    <script>
        document.addEventListener("DOMContentLoaded", () => {
            /* Componets */
            function initScrollSnap(root) {
                const area = root.querySelector(".RaySiteUI-c-scroll-scrollArea");
                const btnLeft = root.querySelector(".RaySiteUI-c-scroll-scrollBtn.left");
                const btnRight = root.querySelector(".RaySiteUI-c-scroll-scrollBtn.right");

                /*if (!btnLeft) {
                    btnLeft = document.createElement("button");
                    btnLeft.textContent = "‹"
                    btnLeft.classList.add('RaySiteUI-c-scroll-scrollBtn', 'left');
                }

                if (!btnRight) {
                    btnRight = document.createElement("button");
                    btnRight.textContent = "‹"
                    btnRight.classList.add('RaySiteUI-c-scroll-scrollBtn', 'left');

                }*/

                if (!area || !btnLeft || !btnRight) return;

                function updateButtons() {
                    const maxScroll = area.scrollWidth - area.clientWidth;

                    // Show left button if we've scrolled past the start
                    if (area.scrollLeft > 0) {
                        btnLeft.classList.add("is-visible");
                    } else {
                        btnLeft.classList.remove("is-visible");
                    }

                    // Check if we are within 1 pixel of the maximum scroll edge
                    const isAtRightEnd = maxScroll - area.scrollLeft <= 1;

                    if (!isAtRightEnd) {
                        btnRight.classList.add("is-visible");
                    } else {
                        btnRight.classList.remove("is-visible");
                    }
                }


                btnLeft.addEventListener("click", () => {
                    area.scrollBy({ left: -area.clientWidth, behavior: "smooth" });
                });

                btnRight.addEventListener("click", () => {
                    area.scrollBy({ left: area.clientWidth, behavior: "smooth" });
                });

                area.addEventListener("scroll", updateButtons);
                window.addEventListener("resize", updateButtons);

                updateButtons();
            }

            document.querySelectorAll('[data-app-uiaction="leftRightScroll"]').forEach(initScrollSnap);





            const triggers = document.querySelectorAll(
                "[data-app-uiaction='openCloseTrigger']"
            );

            const responders = document.querySelectorAll(
                "[data-app-uiaction='openCloseResponder']"
            );

            // Shared memory for group states
            const groupState = new Map();

            // Helper: get responders by group
            function getResponders(group) {
                return [...responders].filter(r => r.dataset.appUiactionGroup === group);
            }

            // Helper: get triggers by group
            function getTriggers(group) {
                return [...triggers].filter(t => t.dataset.appUiactionGroup === group);
            }

            // Core open/close logic
            function setState(group, isOpen) {
                groupState.set(group, isOpen);

                const res = getResponders(group);
                const trg = getTriggers(group);

                res.forEach(r => r.classList.toggle("open", isOpen));
                trg.forEach(t => t.classList.toggle("open", isOpen));
            }

            function toggleState(group) {
                const current = groupState.get(group) || false;
                setState(group, !current);
            }

            // Public API
            window.UIAction = {
                open(group) { setState(group, true); },
                close(group) { setState(group, false); },
                toggle(group) { toggleState(group); }
            };

            // Attach trigger click logic
            triggers.forEach(trigger => {
                trigger.addEventListener("click", e => {
                    const group = trigger.dataset.appUiactionGroup;
                    if (!group) return;

                    // Only stop propagation for NON‑COTC groups
                    if (!group.startsWith("cotc-")) {
                        e.stopPropagation();
                    }


                    toggleState(group);

                    // If group starts with cotc-, enable outside-click auto-close
                    if (group.startsWith("cotc-")) {
                        document.addEventListener("click", function outsideClick(ev) {
                        const isOpen = groupState.get(group);
                        if (!isOpen) {
                            document.removeEventListener("click", outsideClick);
                            return;
                        }

                        // If click is outside all triggers & responders → close
                        const inside = ev.target.closest(
                            `[data-app-uiaction-group='${group}']`
                        );

                        if (!inside) {
                            setState(group, false);
                            document.removeEventListener("click", outsideClick);
                        }
                        });
                    }

                    if (group.startsWith("catc-")) {
                        document.addEventListener("click", function outsideClick(ev) {
                            const isOpen = groupState.get(group);
                            if (!isOpen) {
                                document.removeEventListener("click", outsideClick);
                                return;
                            }

                            // Check if click is inside ANY UIAction element
                            const uiElement = ev.target.closest("[data-app-uiaction-group]");

                            // If inside SAME group → do nothing
                            if (uiElement && uiElement.dataset.appUiactionGroup === group) {
                                return;
                            }

                            // Otherwise (clicked ANY other trigger/responder or outside) → close
                            setState(group, false);
                            document.removeEventListener("click", outsideClick);
                        });
                    }
                });
            });




        });



    </script>
