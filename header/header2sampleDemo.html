    <!-- Payload -->
    <style>
       :root {
            --site-header-layout-desktopHeaderMaxInnerWidth: 1200px; /*Done*/
            --site-header-layout-desktopHeaderMainGap: 24px; /*done*/
            --site-header-layout-mobileHeaderMainGap: 16px; /* done */
            --site-header-layout-desktopHeaderSeparateBorderSpace: 1px;
            --site-header-layout-spaceBetween: 12px;
            --site-header-layout-navMajorGap: 24px;
            --site-header-layout-navMinorGap: 8px;
            --site-header-layout-transitionTime: 300ms;
            --site-header-layout-transitionCurve: ease;
            --site-header-layout-mobileButonRound: 5px;
       }


       /*
       DesktopPosition: (Done!)
       will be assigned for each element with correct source, like:
       .site-content-header-onleft


       MobileMenuPlace: (Done!)
       it is either left or right, it will add:
       .site-content-header-mobile-onleft or onright


       mobileLogoPosition: (Done!)
       Almost same, but is left or center.


       desktopMenuMode:
        as .site-content-header-menumode{number} on wrap


       nestingSupport:
       as .site-content-header-nested{mode} on menu


       mobileMenuMode:
       as .site-content-header-mobileMenuAnimamtion{mode} on menu


       mobileCtaType:
       as .site-content-header-mbutton{mode} on mbotton


       hamAnimation: (Done!)
       as .site-content-header-hamAnim{mode} on hamberger desktop.


       hamAnimationOnDesktop: (Done!)
       as .site-content-header-enableAnimation on hamberber desktop.


       textAlignInMenu:
       as .site-content-header-on{side} on menu


       stickyToBottom:
       as .site-content-header-stickyToBottom if true on mbuttons
       */
    </style>
    <!-- real Header CSS based on prefix: site- -->
    <style main-header>
        /* Start with header */
        .site-header {
            width: 100vw;
            max-width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Style + Size */
        }


        .site-header a {
            text-decoration: none;
            color: unset;
        }


        /* Inner wrap */
        .site-content-header-wrap {
            width: 100%;
            max-width: var(--site-header-layout-desktopHeaderMaxInnerWidth);
            display: flex;
            align-items: stretch;
            justify-content: space-between; /* Unsure about remove it or not*/
            gap: var(--site-header-layout-desktopHeaderMainGap);
            position: relative;
        }


        .site-content-header-wrap * {
            transition: all var(--site-header-layout-transitionTime) var(--site-header-layout-transitionCurve);
        }


        @media (max-width: 768px) {
            .site-content-header-wrap {
                gap: var(--site-header-layout-mobileHeaderMainGap);
            }
        }
    </style>

    <style menu-display-and-animation>


        /* Nav layout */


        /* mode 0 */
        .site-content-header-menumode0 .site-content-header-menu {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }


        /* mode 1-6 */
        .site-content-header-wrap.site-content-header-menumode1 .site-content-header-menu,
        .site-content-header-wrap.site-content-header-menumode2 .site-content-header-menu,
        .site-content-header-wrap.site-content-header-menumode3 .site-content-header-menu,
        .site-content-header-wrap.site-content-header-menumode4 .site-content-header-menu,
        .site-content-header-wrap.site-content-header-menumode5 .site-content-header-menu,
        .site-content-header-wrap.site-content-header-menumode6 .site-content-header-menu {
            position: fixed;
        }


        .site-content-header-wrap.site-content-header-menumode1 .site-content-header-menu {
            left: 0;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }


        .site-content-header-wrap.site-content-header-menumode1.ismenuopen .site-content-header-menu {
            transform: translateX(0);
        }


        .site-content-header-wrap.site-content-header-menumode2 .site-content-header-menu {
            left: 0;
            clip-path: inset(0 100% 0 0);
            transition: clip-path 0.3s ease;
        }


        .site-content-header-wrap.site-content-header-menumode2.ismenuopen .site-content-header-menu {
            clip-path: inset(0 0 0 0);
        }


        .site-content-header-wrap.site-content-header-menumode3 .site-content-header-menu {
            right: 0;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }


        .site-content-header-wrap.site-content-header-menumode3.ismenuopen .site-content-header-menu {
            transform: translateX(0);
        }


        .site-content-header-wrap.site-content-header-menumode4 .site-content-header-menu {
            right: 0;
            clip-path: inset(0 0 0 100%);
            transition: clip-path 0.3s ease;
        }


        .site-content-header-wrap.site-content-header-menumode4.ismenuopen .site-content-header-menu {
            clip-path: inset(0 0 0 0);
        }


        .site-content-header-wrap.site-content-header-menumode5 .site-content-header-menu {
            top: 0;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }


        .site-content-header-wrap.site-content-header-menumode5.ismenuopen .site-content-header-menu {
            transform: translateY(0);
        }


        .site-content-header-wrap.site-content-header-menumode6 .site-content-header-menu {
            top: 0;
            clip-path: inset(100% 0 0 0);
            transition: clip-path 0.3s ease;
        }


        .site-content-header-wrap.site-content-header-menumode6.ismenuopen .site-content-header-menu {
            clip-path: inset(0 0 0 0);
        }




        @media (max-width: 768px) {


            .site-content-header-wrap.site-content-header-menumode0 .site-content-header-menu,
            .site-content-header-wrap.site-content-header-menumode1 .site-content-header-menu,
            .site-content-header-wrap.site-content-header-menumode2 .site-content-header-menu,
            .site-content-header-wrap.site-content-header-menumode3 .site-content-header-menu,
            .site-content-header-wrap.site-content-header-menumode4 .site-content-header-menu,
            .site-content-header-wrap.site-content-header-menumode5 .site-content-header-menu,
            .site-content-header-wrap.site-content-header-menumode6 .site-content-header-menu {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                height: calc(100vh - 100% - 1px);

                transform: none;

            .site-content-header-wrap.ismenuopen .site-content-header-menu.site-content-header-mobileMenuAnimamtion1 {

            }


            .site-content-header-wrap.site-content-header-menumode0 .site-content-header-menu.site-content-header-mobileMenuAnimamtion2,

            .site-content-header-wrap.site-content-header-menumode0 .site-content-header-menu.site-content-header-mobileMenuAnimamtion4,

    <style ham-animation close-buttons>


        /* Hamberger Layout and Close Button */
        .site-content-header-hamberger,
        .site-content-header-closebutton {
            width: 30px;
            height: 30px;


            padding: 0;
            border: 0;


            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 7px;


            background: transparent;


            cursor: pointer;
        }


        .site-content-header-hamberger span,
        .site-content-header-closebutton span {
            display: block;


            width: 30px;
            height: 3px;


            background: currentColor;

     <script>
        // Now is JS runtime.
        function startRuntime(element) {
           


if (element) {
  const hamburger = element.querySelector(".site-content-header-hamberger");
  const closeButton = element.querySelector(".site-content-header-closebutton");
  const menuWrap = element.querySelector(".site-content-header-wrap");


  /*
   * --------------------------------------------------
   * 1. OPEN / CLOSE MAIN MENU
   * --------------------------------------------------
   */


  const clearSubmenus = () => {
    element
      .querySelectorAll(".site-content-header-navpage.issubmenuopen")
      .forEach((navPage) => {
        navPage.classList.remove("issubmenuopen");
      });
  };


  const closeMenu = () => {
    // For nested level 2/3, clear submenu state BEFORE closing.
    const nested = element.querySelector(
      '[class*="site-content-header-nested"]'
    );


    const nestedLevel = getNestedLevel(nested);


    if (nestedLevel === 2 || nestedLevel === 3) {
      clearSubmenus();
    }


    menuWrap?.classList.remove("ismenuopen");
  };


  hamburger?.addEventListener("click", () => {
    menuWrap?.classList.toggle("ismenuopen");
  });


  closeButton?.addEventListener("click", () => {
    closeMenu();
  });




  /*
   * --------------------------------------------------
   * 2. NESTED MENU BEHAVIOR
   * --------------------------------------------------
   *
   * Supported:
   *
   * .site-content-header-nested1
   * .site-content-header-nested2
   * .site-content-header-nested3
   */


  function getNestedLevel(nested) {
    if (!nested) return 0;


    // Finds the number at the end of:
    // site-content-header-nested1
    // site-content-header-nested2
    // site-content-header-nested3
    for (const className of nested.classList) {
      const match = className.match(
        /^site-content-header-nested(\d+)$/
      );


      if (match) {
        return Number(match[1]);
      }
    }


    return 0;
  }


  function setupNestedMenu(nested) {
    const level = getNestedLevel(nested);


    // 0 = do nothing
    if (level === 0) return;


    const navPages = nested.querySelectorAll(
      ".site-content-header-navpage"
    );


    /*
     * LEVEL 1
     *
     * Every navpage that has a submenu icon
     * starts with .issubmenuopen.
     */
    if (level === 1) {
      navPages.forEach((navPage) => {
        const submenuIcon = navPage.querySelector(
          ".site-content-header-menusubicon"
        );


        if (submenuIcon) {
          navPage.classList.add("issubmenuopen");
        }
      });


      return;
    }


    /*
     * LEVEL 2 / 3
     *
     * Only one submenu can be open at a time.
     */


    navPages.forEach((navPage) => {
      const submenuIcon = navPage.querySelector(
        ".site-content-header-menusubicon"
      );


      if (!submenuIcon) return;


      /*
       * LEVEL 2:
       * Clicking the submenu icon opens this navpage.
       *
       * LEVEL 3:
       * Same behavior, but the clickable element must
       * be a button inside the navpage's direct <a>.
       */
      let trigger = submenuIcon;


      if (level === 3) {
        trigger = navPage.querySelector(":scope > a button");


        if (!trigger) return;
      }


      trigger.addEventListener("click", (event) => {
        event.preventDefault();


        // Close every currently-open submenu first.
        navPages.forEach((page) => {
          page.classList.remove("issubmenuopen");
        });


        // Then open the clicked one.
        navPage.classList.add("issubmenuopen");
      });
    });
  }


  /*
   * Find every nested element and configure it.
   *
   * Elements without a numeric suffix are ignored.
   */
  element
    .querySelectorAll('[class*="site-content-header-nested"]')
    .forEach(setupNestedMenu);




  /*
   * --------------------------------------------------
   * 3. .onTop
   * --------------------------------------------------
   *
   * When the menu is open:
   *   .onTop is ALWAYS removed.
   *
   * When the menu is closed:
   *   .onTop depends on whether the header is
   *   at the top of the webpage.
   */


  const updateOnTop = () => {
    if (!menuWrap) return;


    const menuIsOpen = menuWrap.classList.contains("ismenuopen");


    // Menu open = never onTop.
    if (menuIsOpen) {
      element.classList.remove("onTop");
      return;
    }


    // Menu closed = onTop depends on scroll position.
    const isAtTop = window.scrollY <= 0;


    element.classList.toggle("onTop", isAtTop);
  };


  window.addEventListener("scroll", updateOnTop, { passive: true });


  /*
   * Recalculate immediately and whenever the menu
   * is opened/closed.
   */
  hamburger?.addEventListener("click", updateOnTop);
  closeButton?.addEventListener("click", updateOnTop);


  updateOnTop();
}


        }

        (layout.mobileLogoPosition === "left") ? "oncenter" : "onleft";


    spaceWrap.classList.add(
        `${prefix}content-header-mobile-${resultForSpace ?? "onhidden"}`
    )
       
    /*
       desktopMenuMode:
        as .site-content-header-menumode{number} on wrap
    */
    contentWrap.classList.add(
        `${prefix}content-header-menumode${layout.desktopMenuMode ?? 0}`
    );


    /*
       nestingSupport:
       as .site-content-header-nested{mode} on menu
    */
    nav.classList.add(
        `${prefix}content-header-nested${layout.nestingSupport}`
    );


    const nestingSupport = layout.nestingSupport;


    if (nestingSupport >= 1 && nestingSupport <= 4) {
        nav.querySelectorAll(
            `.${prefix}content-header-navpage`
        ).forEach((navpage) => {
            const submenu = navpage.querySelector(
                `:scope > .${prefix}content-header-submenu`
            );


            // No submenu = nothing to process.
            if (!submenu) {
                return;
            }


            /*
            * nestingSupport 1, 2, 3:
            * Add the submenu icon before the submenu.
            *
            * nestingSupport 4:
            * No submenu icon.
            */
            if (nestingSupport <= 3) {
                const subIcon = document.createElement('span');


                subIcon.className =
                    `${prefix}content-header-menusubicon`;


                // Plain Unicode character, not an emoji.
                subIcon.textContent = '▶';


                submenu.before(subIcon);
            }






            /*
            * nestingSupport 3, 4:
            * Clone the original navpage link and place
            * the duplicate immediately after the submenu.
            */
            if (nestingSupport >= 3) {
                const link = navpage.querySelector(
                    `:scope > a`
                );


                if (link) {
                    const clonedLink = link.cloneNode(true);


                    const li = document.createElement('li');
                    li.appendChild(clonedLink);


                    submenu.prepend(li);
                }
            }


            /*
            * nestingSupport 2, 3, 4:
            * Add the close button as the first element
            * inside the submenu.
            */
            if (nestingSupport >= 2) {
                const closeButton = document.createElement('button');


                closeButton.className =
                    `${prefix}content-header-closebutton`;


                closeButton.innerHTML = `
                    <span></span>
                    <span></span>
                    <span></span>
                `;


                submenu.prepend(closeButton);
            }
        });
    }


    /*
       mobileMenuMode:
       as .site-content-header-mobileMenuAnimamtion{mode} on menu
    */
    nav.classList.add(
        `${prefix}content-header-mobileMenuAnimamtion${layout.mobileMenuMode ?? 6}`
    );
   
    /*
       mobileCtaType:
       as .site-content-header-mbutton{mode} on mbotton
    */
    mobileButtons.classList.add(
        `${prefix}content-header-mbutton${layout.mobileCtaType ?? 1}`
    );


    /*
       hamAnimation:
       as .site-content-header-hamAnim{mode} on hamberger desktop.
    */
    hamburger.classList.add(
        `${prefix}content-header-hamAnim${layout.hamAnimation ?? 2}`
    )


    /*
        hamAnimationOnDesktop:
        as .site-content-header-enableAnimation on hamberber desktop.
    */
    hamburger.classList.add(
        `${prefix}content-header-enableAnimation`
    )


    nav.classList.add(
        `${prefix}content-header-on${layout.textAlignInMenu ?? "left"}`
    );


    if (layout.stickyToBottom) {
        mobileButtons.classList.add(
            `${prefix}content-header-stickyToBottom`
        );
    }


    // End Layout Creation


    // Return it back.
}
    </script>
