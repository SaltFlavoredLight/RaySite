       DesktopPosition:

       it is either left or right, it will add:

       mobileLogoPosition:
       Almost same, but is left or center.

       desktopMenuMode:
        as .site-content-header-menumode{number} on wrap

       nestingSupport:
       as .site-content-header-nested{mode} on menu

       mobileMenuMode: with added DOM change
