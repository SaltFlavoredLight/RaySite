    <style main-header="complete">
        /* Start with header */
        .site-header {
            width: 100%;
            max-width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Style + Size */
        }

        @media (max-width: 768px) {
            .site-header {
                position: sticky;
                top: 0;
            }
        } 

        .site-header a {
            text-decoration: none;
            color: unset;
        }

        /* Inner wrap */
        .site-content-header-wrap {
            width: 100%;
            max-width: var(--site-header-layout-desktopHeaderMaxInnerWidth);
            display: flex;
            align-items: stretch;
            justify-content: space-between; /* Unsure about remove it or not*/
            gap: var(--site-header-layout-desktopHeaderMainGap);
            position: relative;
        }

        .site-content-header-wrap * {
            transition: all var(--site-header-layout-transitionTime) var(--site-header-layout-transitionCurve);
        }

        @media (max-width: 768px) {
            .site-content-header-wrap {
                gap: var(--site-header-layout-mobileHeaderMainGap);
            }
        }
    </style>

    <!-- Runtime script -->
    <script>
    // Now is JS runtime.
    function startRuntime(element) {

        if (element) {
        const hamburger = element.querySelector(
            ".site-content-header-hamberger"
        );

        const menuWrap = element.querySelector(
            ".site-content-header-wrap"
        );


        /*
        * --------------------------------------------------
        * 1. OPEN / CLOSE MAIN MENU
        * --------------------------------------------------
        */

        const clearSubmenus = (scope = element) => {
            scope
            .querySelectorAll(
                ".site-content-header-navpage.issubmenuopen"
            )
            .forEach((navPage) => {
                navPage.classList.remove("issubmenuopen");
            });
        };


        const closeMenu = () => {
            clearSubmenus();
            menuWrap?.classList.remove("ismenuopen");
        };


        hamburger?.addEventListener("click", () => {
            menuWrap?.classList.toggle("ismenuopen");
        });


        /*
        * --------------------------------------------------
        * 2. CLOSE BUTTONS
        * --------------------------------------------------
        *
        * There are TWO different types:
        *
        * A. GLOBAL CLOSE BUTTON
        *
        *    .site-content-header-closebutton
        *    located directly in / under the main WRAP,
        *    but NOT inside a navpage.
        *
        *    => closes the ENTIRE menu.
        *
        *
        * B. NAVPAGE CLOSE BUTTON
        *
        *    .site-content-header-closebutton
        *    located inside a .site-content-header-navpage.
        *
        *    => closes ONLY that navpage's submenu.
        *
        * This listener is document-level because the global
        * close button / Subpage can exist outside `element`.
        * --------------------------------------------------
        */

        document.addEventListener("click", (event) => {

            const target = event.target;

            if (!(target instanceof Element)) return;


            const closeButton =
            target.closest(
                ".site-content-header-closebutton"
            );

            if (!closeButton) return;


            /*
            * First determine whether this close button
            * belongs to a navpage.
            */
            const navPage =
            closeButton.closest(
                ".site-content-header-navpage"
            );


            /*
            * ------------------------------------------------
            * NAVPAGE CLOSE BUTTON
            * ------------------------------------------------
            *
            * Only close THIS submenu level.
            */
            if (navPage) {

            navPage.classList.remove(
                "issubmenuopen"
            );

            /*
            * Do NOT close the main menu.
            * Do NOT clear other submenu levels.
            */
            return;
            }


            /*
            * ------------------------------------------------
            * GLOBAL CLOSE BUTTON
            * ------------------------------------------------
            *
            * It is not inside a navpage, so it closes
            * the entire menu.
            */
            if (
            menuWrap &&
            (
                menuWrap.contains(closeButton) ||
                element.contains(closeButton)
            )
            ) {
                closeMenu();
            }

        });


        /*
        * --------------------------------------------------
        * 3. NESTED MENU BEHAVIOR
        * --------------------------------------------------
        *
        * Mode 1:
        *   Opening a submenu does NOT close other submenus.
        *
        * Mode 2 / 3 / 4:
        *   Opening a submenu closes other submenus
        *   in the SAME menu level.
        *
        * Clicking an already-open submenu toggles it closed.
        * --------------------------------------------------
        */

        function getNestedLevel(nested) {

            if (!nested) return 0;

            for (const className of nested.classList) {

            const match = className.match(
                /^site-content-header-nested(\d+)$/
            );

            if (match) {
                return Number(match[1]);
            }
            }

            return 0;
        }


        /*
        * Find every nested mode.
        */
        element
            .querySelectorAll(
            '[class*="site-content-header-nested"]'
            )
            .forEach((nested) => {

            const level = getNestedLevel(nested);



            if (
                level !== 1 &&
                level !== 2 &&
                level !== 3 &&
                level !== 4
            ) {
                return;
            }


            /*
            * Find the menu bar belonging to this mode.
            */
            const menu =
                nested.querySelector(
                ".site-content-header-menu"
                ) ||
                element.querySelector(
                ".site-content-header-menu"
                );


            if (!menu) return;


            /*
            * Find every navpage in this menu.
            */
            const navPages = Array.from(
                menu.querySelectorAll(
                ".site-content-header-navpage"
                )
            );


            /*
            * ------------------------------------------------
            * Toggle one submenu.
            * ------------------------------------------------
            */
            const toggleSubmenu = (navPage) => {

                const isOpen =
                    navPage.classList.contains(
                        "issubmenuopen"
                    );

                /*
                * If opening:
                *
                * Mode 1:
                *   Leave all other submenus alone.
                *
                * Mode 2/3/4:
                *   Close other navpages in this menu.
                */
                if (!isOpen && ((level == 2 || level == 3) && (window.innerWidth >= 768))) {

                    navPages.forEach((page) => {

                        if (page !== navPage) {

                            page.classList.remove(
                                "issubmenuopen"
                            );
                        }

                    });
                }

                const element = navPage.querySelector(".site-content-header-submenu");

                if (element && ((level == 1 || level == 4) || (window.innerWidth <= 768))) {
                    if (!isOpen) {
                        element.style.maxHeight = element.scrollHeight + "px";
                    } else {
                        element.style.maxHeight = element.scrollHeight + "px";

                        requestAnimationFrame(() => {
                            element.style.maxHeight = null;
                        });
                    }
                }

                
                debugger;
                /*
                * This is the ONLY state change.
                * CSS handles the animation.
                */
                navPage.classList.toggle(
                    "issubmenuopen"
                );
            };


            /*
            * Configure every navpage.
            */
            navPages.forEach((navPage) => {

                /*
                * Find submenu icon.
                *
                * No icon = no submenu trigger.
                */
                const submenuIcon =
                navPage.querySelector(
                    ".site-content-header-menusubicon"
                );


                /*
                * ------------------------------------------------
                * SUBMENU ICON
                * ------------------------------------------------
                */
                if (submenuIcon) {

                submenuIcon.addEventListener(
                    "click",
                    (event) => {

                    event.preventDefault();
                    event.stopPropagation();

                    toggleSubmenu(navPage);
                    }
                );
                }


                /*
                * ------------------------------------------------
                * MODE 3 / 4
                *
                * The FIRST direct element of the navpage
                * becomes another trigger.
                *
                * It can be:
                *   <a>
                *   <span>
                *   etc.
                *
                * Its normal action is prevented.
                *
                * It performs EXACTLY the same toggle as
                * clicking the submenu icon.
                * ------------------------------------------------
                */
                if (
                    (level === 3 || level === 4) &&
                    navPage.querySelector(':scope > .site-content-header-submenu')
                ) {

                    const firstElement =
                        navPage.querySelector(
                        ":scope > *"
                        );


                    if (firstElement) {

                        firstElement.addEventListener(
                        "click",
                        (event) => {

                            event.preventDefault();
                            event.stopPropagation();

                            toggleSubmenu(navPage);
                        }
                        );
                    }
                    }

                });

            });


        /*
        * --------------------------------------------------
        * 4. .onTop
        * --------------------------------------------------
        */

        const updateOnTop = () => {

            if (!menuWrap) return;


            const menuIsOpen =
            menuWrap.classList.contains(
                "ismenuopen"
            );


            /*
            * Menu open = never onTop.
            */
            if (menuIsOpen) {

            element.classList.remove(
                "onTop"
            );

            return;
            }


            /*
            * Menu closed = onTop depends on scroll.
            */
            const isAtTop =
            window.scrollY <= 0;


            element.classList.toggle(
            "onTop",
            isAtTop
            );
        };


        window.addEventListener(
            "scroll",
            updateOnTop,
            { passive: true }
        );


        hamburger?.addEventListener(
            "click",
            updateOnTop
        );


        /*
        * A global close button changes the main menu state,
        * so update .onTop after it is clicked.
        *
        * A navpage close button does NOT affect the main
        * menu state, so it does not need updateOnTop().
        */
        document.addEventListener("click", (event) => {

            const target = event.target;

            if (!(target instanceof Element)) return;


            const closeButton =
            target.closest(
                ".site-content-header-closebutton"
            );

            if (!closeButton) return;


            const navPage =
            closeButton.closest(
                ".site-content-header-navpage"
            );


            /*
            * Only global close buttons update the main
            * header state.
            */
            if (!navPage) {
            updateOnTop();
            }

        });





        updateOnTop();
        }
    }
    </script>

    <!-- Creating HTML! -->
    <script>
function createHeader(dataArray, documentHTML, node, createAnotherNode) {

    // Do a setup
    const content = dataArray.content || {};
    const layout = dataArray.layout || {};
    const prefix = BUILDER_CONFIG.classPrefix;

    const header = node;
    // End Setup


    // Start Content Creation

    // Wrap
    const contentWrap = documentHTML.createElement(`div`);
    contentWrap.classList.add(`${prefix}content-header-wrap`);
    header.appendChild(contentWrap);

    // Hamburger
    const hamburger = documentHTML.createElement(`button`);
    hamburger.classList.add(`${prefix}content-header-hamberger`);
    hamburger.setAttribute(`aria-label`, `Open navigation menu`);
    hamburger.type = `button`;

    for (let i = 0; i < 3; i++) {
        const span = documentHTML.createElement(`span`);
        span.setAttribute(`aria-hidden`, `true`);
        hamburger.appendChild(span);
    }

    contentWrap.appendChild(hamburger);

    // Logo
    const logoWrap = documentHTML.createElement(`div`);
    logoWrap.classList.add(`${prefix}content-header-logo`);

    const logoLink = documentHTML.createElement(`a`);
    logoLink.classList.add(`logo`);
    logoLink.href = `/`;

    if (content[`logo.type`] === `text`) {
        const logoText = documentHTML.createElement(`h2`);

        if (content[`logo.text`] != null) {
            logoText.innerText = content[`logo.text`] ?? "";
        }

        logoLink.appendChild(logoText);
 
    }

    if (content[`logo.type`] === `image`) {
        const logoImage = documentHTML.createElement(`img`);

        if (content[`logo.image`] != null) {
            logoImage.src = content[`logo.image`];
        }

        logoLink.appendChild(logoImage);
    }

    logoWrap.appendChild(logoLink);
    contentWrap.appendChild(logoWrap);

    // Navigation
    const nav = documentHTML.createElement(`nav`);
    nav.classList.add(`${prefix}content-header-menu`);
    nav.setAttribute(`aria-label`, `Primary navigation`);

    // Close button
    const closeButton = documentHTML.createElement(`button`);
    closeButton.classList.add(`${prefix}content-header-closebutton`);
    closeButton.setAttribute(`aria-label`, `Close navigation menu`);
    closeButton.type = `button`;

    for (let i = 0; i < 3; i++) {
        const span = documentHTML.createElement(`span`);
        span.setAttribute(`aria-hidden`, `true`);
        closeButton.appendChild(span);
    }

    nav.appendChild(closeButton);


    // Navigation list
    const navList = documentHTML.createElement(`ul`);

    const navItems = Array.isArray(content.nav)
        ? content.nav
        : [];

    navItems.forEach(navData => {
        const navItem = documentHTML.createElement(`li`);
        navItem.classList.add(`${prefix}content-header-navpage`);

        const navLink = documentHTML.createElement(
            navData.url ? `a` : `span`
        );

        navLink.textContent = navData.name ?? ``;

        if (navData.url) {
            navLink.href = navData.url;
        }

        navItem.appendChild(navLink);

        // Submenu
        if (
            Array.isArray(navData.children) &&
            navData.children.length > 0
        ) {
            const submenu = documentHTML.createElement(`ul`);
            submenu.classList.add(`${prefix}content-header-submenu`);

            navData.children.forEach(childData => {
                const submenuItem = documentHTML.createElement(`li`);

                const submenuLink = documentHTML.createElement(
                    childData.url ? `a` : `span`
                );

                submenuLink.textContent = childData.name ?? ``;

                if (childData.url) {
                    submenuLink.href = childData.url;
                }

                submenuItem.appendChild(submenuLink);
                submenu.appendChild(submenuItem);
            });

            navItem.appendChild(submenu);
        }

        navList.appendChild(navItem);
    });

    nav.appendChild(navList);
  

    // Mobile buttons
    const mobileButtons = documentHTML.createElement(`div`);
    mobileButtons.classList.add(`${prefix}content-header-mbuttons`);

    if (content[`secondaryButton.enable`]) {
        const mobileSecondary = documentHTML.createElement(`a`);
        mobileSecondary.classList.add(
            `${prefix}content-header-secondaryCTA`
        );
        mobileSecondary.textContent =
            content[`secondaryButton.text`] ?? ``;

        if (content[`secondaryButton.url`] != null) {
            mobileSecondary.href =
                content[`secondaryButton.url`];
        }

        if (content[`secondaryButton.newPage`]) {
            mobileSecondary.target = `_blank`;
            mobileSecondary.rel = `noopener noreferrer`;
        }

        mobileButtons.appendChild(mobileSecondary);
    }

    if (content[`primaryButton.enable`]) {
        const mobilePrimary = documentHTML.createElement(`a`);
        mobilePrimary.classList.add(
            `${prefix}content-header-primaryCTA`
        );
        mobilePrimary.textContent =
            content[`primaryButton.text`] ?? ``;

        if (content[`primaryButton.url`] != null) {
            mobilePrimary.href =
                content[`primaryButton.url`];
        }

        if (content[`primaryButton.newPage`]) {
            mobilePrimary.target = `_blank`;
            mobilePrimary.rel = `noopener noreferrer`;
        }

        mobileButtons.appendChild(mobilePrimary);
    }

    nav.appendChild(mobileButtons);
    contentWrap.appendChild(nav);



    // Desktop buttons
    const buttons = documentHTML.createElement(`div`);
    buttons.classList.add(`${prefix}content-header-buttons`);

    if (content[`secondaryButton.enable`]) {
        const secondary = documentHTML.createElement(`a`);
        secondary.classList.add(
            `${prefix}content-header-secondaryCTA`
        );
        secondary.textContent =
            content[`secondaryButton.text`] ?? ``;

        if (content[`secondaryButton.url`] != null) {
            secondary.href =
                content[`secondaryButton.url`];
        }

        if (content[`secondaryButton.newPage`]) {
            secondary.target = `_blank`;
            secondary.rel = `noopener noreferrer`;
        }

        buttons.appendChild(secondary);
    }

    if (content[`primaryButton.enable`]) {
        const primary = documentHTML.createElement(`a`);
        primary.classList.add(
            `${prefix}content-header-primaryCTA`
        );

    */
    nav.classList.add(
        `${prefix}content-header-nested${layout.nestingSupport}`
    );

    const nestingSupport = layout.nestingSupport;

    if (nestingSupport >= 1 && nestingSupport <= 5) {
        nav.querySelectorAll(
            `.${prefix}content-header-navpage`
        ).forEach((navpage) => {
            const submenu = navpage.querySelector(
                `:scope > .${prefix}content-header-submenu`
            );

            // No submenu = nothing to process.
            if (!submenu) {
                return;
            }

            /*
            * nestingSupport 1, 2, 3, 5:
            * Add the submenu icon before the submenu.
            *
            * nestingSupport 4:
            * No submenu icon.
            */
            if (nestingSupport <= 3 || nestingSupport == 5) {
                const subIcon = document.createElement('button');

                subIcon.className =
                    `${prefix}content-header-menusubicon`;

                // Plain Unicode character, not an emoji.
                subIcon.textContent = '▶';

                submenu.before(subIcon);
            }



            /*
            * nestingSupport 3, 4, 5:
            * Clone the original navpage link and place
            * the duplicate immediately after the submenu.
            */
            if (nestingSupport >= 3) {
                const link = navpage.querySelector(
                    `:scope > a`
                );

                if (link) {
                    const clonedLink = link.cloneNode(true);

                    const li = document.createElement('li');
                    li.appendChild(clonedLink);

                    submenu.prepend(li);
                }
            }

            /*
            * nestingSupport 2, 3:
            * Add the close button as the first element
            * inside the submenu.
            */
            if (nestingSupport == 2 || nestingSupport == 3) {
                const closeButton = document.createElement('button');

                closeButton.className =
                    `${prefix}content-header-closebutton`;

                closeButton.innerHTML = `
                    <span></span>
                    <span></span>
                    <span></span>
                `;

                submenu.prepend(closeButton);
            }
        });
    }

}
