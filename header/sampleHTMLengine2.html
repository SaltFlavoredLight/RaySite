.site-header {
    width: 100%;
    display: flex;
}

.site-content-header-wrap {
    width: 100%;
    display: flex;
    flex-grow: 1;
    justify-content: space-between;
    align-items: stretch;
}

.site-content-header-onhidden {
	display: hidden;   
}

/* Order Property is different.
1x - left, 2x - center, 3x - right*/

/* start with position for left, center and right. */
.site-content-header-onleft {
    flex: 0 0 auto;
    text-align: start;
    align-items: flex-start;
    margin-right: 0;
    margin-left: 0;   
    order: 10; 
}


.site-content-header-hamberger.site-content-header-onleft {
	order: 11;
}

.site-content-header-logo.site-content-header-onleft {
	order: 12;
}

.site-content-header-buttons.site-content-header-onleft {
	order: 13;
}

.site-content-header-menu.site-content-header-onleft {
	order: 14;
}

.site-content-header-oncenter {
    flex: 8 8 auto;
    align-items: center;
    text-align: center;
    order: 25;
}


.site-content-header-onright {
    flex: 0 0 auto;
    text-align: end;
    align-items: flex-end;
    margin-left: 0;
    margin-left: 0;  
    order: 30 
}

.site-content-header-hamberger.site-content-header-onright {
	order: 39;
}

.site-content-header-logo.site-content-header-onright {
	order: 38;
}

.site-content-header-buttons.site-content-header-onright {
	order: 37;
}

.site-content-header-menu.site-content-header-onright {
	order: 36;
}

/* end of position */

/* start of basics */
.site-content-header-wrap a {
    text-decoration: none;
    color: inherit;
}
/* end of basics */

/* start of the Menu Mode for desktop. */

.site-content-header-mbuttons {
    display: none;
}

/* mode 0 */
.site-content-header-menumode0 .site-content-header-hamberger {
    display: none;
}

.site-content-header-menumode0 .site-content-header-menu .site-content-header-closebutton  {
    display: none;
}

.site-content-header-menumode0 .site-content-header-menu > ul  {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.site-content-header-menumode0 .site-content-header-menu .site-content-header-navpage  {
    position: relative;
}

.site-content-header-menumode0 .site-content-header-menu .site-content-header-navpage > a {
    margin-bottom: 3px; /* Snap: use the varible for desktopHeaderSeparateBorderSpace */
}

.site-content-header-menumode0 .site-content-header-menu .site-content-header-submenu {
    position: absolute;
    clip-path: inset(0 0 100% 0);
    text-align: start;
    left: 0;
    top: 100%; 
}

.site-content-header-menumode0 .site-content-header-menu .site-content-header-navpage:hover .site-content-header-submenu {
    clip-path: inset(0 0 0 0);
}

/* TODO! FIx that position of menu, add space, and everything.*/
.site-content-header-menumode1 .site-content-header-menu,
.site-content-header-menumode2 .site-content-header-menu,
.site-content-header-menumode3 .site-content-header-menu,
.site-content-header-menumode4 .site-content-header-menu,
.site-content-header-menumode5 .site-content-header-menu,
.site-content-header-menumode6 .site-content-header-menu {
    position: fixed;
}

.site-content-header-menumode1 .site-content-header-menu,
.site-content-header-menumode2 .site-content-header-menu {
    top: 0;
    height: 100vh;
    left: 0;
    transform: translateX(-100%);
    text-align: left;
    display: flex; flex-direction: column; align-items: flex-start;
}

.site-content-header-menumode1.ismenuopen .site-content-header-menu,
.site-content-header-menumode2.ismenuopen .site-content-header-menu {
    transform: translateX(0);
}

.site-content-header-menumode3 .site-content-header-menu,
.site-content-header-menumode4 .site-content-header-menu {
    top: 0;
    height: 100vh;
    right: 0;
    text-align: right;
    display: flex; flex-direction: column; align-items: flex-end;
}

.site-content-header-menumode5 .site-content-header-menu,
.site-content-header-menumode6 .site-content-header-menu {
    top: 0;
    right: 0;
    text-align: center;
}


/* end of the Menu Mode for desktop. (covermobile)*/


/* Start for hambergers */
.site-content-header-hamberger,
.site-content-header-closebutton {
  width: 30px;
  height: 30px;

  padding: 0;
  border: 0;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 7px;

  background: transparent;
  color: #fff;

  cursor: pointer;
}

.site-content-header-hamberger span {
  display: block;

  width: 30px;
  height: 30px;

  background: currentColor;
  border-radius: 999px;
}


.site-content-header-closebutton span {
  position: absolute;

  width: 30px;
  height: 3px;

  background: currentColor;
  border-radius: 20px;
}

.site-content-header-closebutton span:nth-child(1) {
  rotate: 135deg;
}

.site-content-header-closebutton span:nth-child(2) {
  rotate: 135deg;
}

.site-content-header-closebutton span:nth-child(3) {
  rotate: -135deg;
}

/* End for hambergers */

.site-content-header-logo {
	background-color: #dddddd;
}

.site-content-header-menu {
	background-color: #aaaaaa;
}

.site-content-header-buttons {
	background-color: #ffffff;
}


    </style>
</head>

<body>



    <header id="preview"></header>

    <div class="demo-controls">
        <button id="generateButton">
            Generate Header
        </button>
    </div>


    <script>
function createFlexEngineStyleVaribles() {
    return {
        space: (value) => value,
        curve: (value) => value,
        integer: (value) => value,
        boolean: (value) => value,

    };
}

const flexEngineStyleVarible = createFlexEngineStyleVaribles();



const sampleData = {
    content: {
        "logo.type": "text",
        "logo.text": "RaySite",

        nav: [
            {
                name: "Home",
                children: [],
                url: "/"
            },
            {
                name: "All Product",
                children: [
                    {
                        name: "Website",
                        children: [],
                        url: "/products/website"
                    },
                    {
                        name: "CMS",
                        children: [],
                        url: "/products/cms"
                    },
                    {
                        name: "Notebook",
                        children: [],
                        url: "/products/notebook"
                    },
                    {
                        name: "Member Management",
                        children: [],
                        url: "/products/member-management"
                    }
                ],
                url: "/products"
            },
            {
                name: "Solution",
                children: [],
                url: "/solution"
            },
            {
                name: "About Us",
                children: [
                    {
                        name: "About Us",
                        children: [],
                        url: "/about-us"
                    },
                    {
                        name: "History",
                        children: [],
                        url: "/about-us/history"
                    },
                    {
                        name: "Blog",
                        children: [],
                        url: "/blog"
                    },
                    {
                        name: "Devaloper's Docs",
                        children: [],
                        url: "/docs"
                    }
                ],
                url: "/about-us"
            }
        ],

        "primaryButton.enable": true,
        "primaryButton.text": "Get Started",
        "primaryButton.url": "/get-started",
        "primaryButton.newPage": false,

        "secondaryButton.enable": true,
        "secondaryButton.text": "Log in",
        "secondaryButton.url": "/login",
        "secondaryButton.newPage": false
    },

    layout: {
        desktopPosition: 1, // done
        mobileMenuPlace: "left",
        mobileLogoPosition: "left",
        desktopHeaderMaxInnerWidth: "1200px",
        desktopHeaderMainGap: "24px",
        mobileHeaderMainGap: "16px",
        desktopHeaderSeparateBorderSpace: "1px",
        desktopMenuMode: 1,
        spaceBetween: "12px",
        navMajorGap: "24px",
        navMinorGap: "8px",
        nestingSupport: 1,
        transitionTime: 300,
        transitionCurve: "ease",
        mobileMenuMode: 1,
        mobileCtaType: 0,
        hamAnimation: 1
    }
};

const BUILDER_CONFIG = {
    classPrefix: "site-"
}

function createHeader(dataArray, documentHTML, node, createAnotherNode) {
    const content = dataArray.content || {};
    const layout = dataArray.layout || {};
    const prefix = BUILDER_CONFIG.classPrefix;

    const header = node;

    const contentWrap = documentHTML.createElement(`div`);
    contentWrap.classList.add(`${prefix}content-header-wrap`);
    header.appendChild(contentWrap);


    // Hamburger
    const hamburger = documentHTML.createElement(`button`);
    hamburger.classList.add(`${prefix}content-header-hamberger`);
    hamburger.setAttribute(`aria-label`, `Open navigation menu`);
    hamburger.type = `button`;

    for (let i = 0; i < 3; i++) {
        const span = documentHTML.createElement(`span`);
        span.setAttribute(`aria-hidden`, `true`);
        hamburger.appendChild(span);
    }

    contentWrap.appendChild(hamburger);


    // Logo
    const logoWrap = documentHTML.createElement(`div`);
    logoWrap.classList.add(`${prefix}content-header-logo`);

    const logoLink = documentHTML.createElement(`a`);
    logoLink.classList.add(`logo`);
    logoLink.href = `/`;

    if (content[`logo.type`] === `text`) {
        logoLink.textContent = content[`logo.text`] ?? ``;
    }

    if (content[`logo.type`] === `image`) {
        const logoImage = documentHTML.createElement(`img`);

        if (content[`logo.image`] != null) {
            logoImage.src = content[`logo.image`];
        }

        logoLink.appendChild(logoImage);
    }

    logoWrap.appendChild(logoLink);
    contentWrap.appendChild(logoWrap);


    // Navigation
    const nav = documentHTML.createElement(`nav`);
    nav.classList.add(`${prefix}content-header-menu`);
    nav.setAttribute(`aria-label`, `Primary navigation`);


    // Close button
    const closeButton = documentHTML.createElement(`button`);
    closeButton.classList.add(`${prefix}content-header-closebutton`);
    closeButton.setAttribute(`aria-label`, `Close navigation menu`);
    closeButton.type = `button`;

    for (let i = 0; i < 3; i++) {
        const span = documentHTML.createElement(`span`);
        span.setAttribute(`aria-hidden`, `true`);
        closeButton.appendChild(span);
    }

    nav.appendChild(closeButton);


    // Navigation list
    const navList = documentHTML.createElement(`ul`);

    const navItems = Array.isArray(content.nav)
        ? content.nav
        : [];

    navItems.forEach(navData => {
        const navItem = documentHTML.createElement(`li`);
        navItem.classList.add(`${prefix}content-header-navpage`);

        const navLink = documentHTML.createElement(`a`);
        navLink.textContent = navData.name ?? ``;

        if (navData.url != null) {
            navLink.href = navData.url;
        }

        navItem.appendChild(navLink);


        // Submenu
        if (
            Array.isArray(navData.children) &&
            navData.children.length > 0
        ) {
            const submenu = documentHTML.createElement(`ul`);
            submenu.classList.add(`${prefix}content-header-submenu`);

            navData.children.forEach(childData => {
                const submenuItem = documentHTML.createElement(`li`);

                const submenuLink = documentHTML.createElement(`a`);
                submenuLink.textContent = childData.name ?? ``;

                if (childData.url != null) {
                    submenuLink.href = childData.url;
                }

                submenuItem.appendChild(submenuLink);
                submenu.appendChild(submenuItem);
            });

            navItem.appendChild(submenu);
        }

        navList.appendChild(navItem);
    });

    nav.appendChild(navList);


    // Mobile buttons
    const mobileButtons = documentHTML.createElement(`div`);
    mobileButtons.classList.add(`${prefix}content-header-mbuttons`);

    if (content[`secondaryButton.enable`]) {
        const mobileSecondary = documentHTML.createElement(`a`);
        mobileSecondary.classList.add(
            `${prefix}content-header-secondaryCTA`
        );
        mobileSecondary.textContent =
            content[`secondaryButton.text`] ?? ``;

        if (content[`secondaryButton.url`] != null) {
            mobileSecondary.href =
                content[`secondaryButton.url`];
        }

        if (content[`secondaryButton.newPage`]) {
            mobileSecondary.target = `_blank`;
            mobileSecondary.rel = `noopener noreferrer`;
        }

        mobileButtons.appendChild(mobileSecondary);
    }

    if (content[`primaryButton.enable`]) {
        const mobilePrimary = documentHTML.createElement(`a`);
        mobilePrimary.classList.add(
            `${prefix}content-header-primaryCTA`
        );
        mobilePrimary.textContent =
            content[`primaryButton.text`] ?? ``;

        if (content[`primaryButton.url`] != null) {
            mobilePrimary.href =
                content[`primaryButton.url`];
        }

        if (content[`primaryButton.newPage`]) {
            mobilePrimary.target = `_blank`;
            mobilePrimary.rel = `noopener noreferrer`;
        }

        mobileButtons.appendChild(mobilePrimary);
    }

    nav.appendChild(mobileButtons);
    contentWrap.appendChild(nav);


    // Desktop buttons
    const buttons = documentHTML.createElement(`div`);
    buttons.classList.add(`${prefix}content-header-buttons`);

    if (content[`secondaryButton.enable`]) {
        const secondary = documentHTML.createElement(`a`);
        secondary.classList.add(
            `${prefix}content-header-secondaryCTA`
        );
        secondary.textContent =
            content[`secondaryButton.text`] ?? ``;

        if (content[`secondaryButton.url`] != null) {
            secondary.href =
                content[`secondaryButton.url`];
        }

        if (content[`secondaryButton.newPage`]) {
            secondary.target = `_blank`;
            secondary.rel = `noopener noreferrer`;
        }

        buttons.appendChild(secondary);
    }

    if (content[`primaryButton.enable`]) {
        const primary = documentHTML.createElement(`a`);
        primary.classList.add(
            `${prefix}content-header-primaryCTA`
        );
        primary.textContent =
            content[`primaryButton.text`] ?? ``;

        if (content[`primaryButton.url`] != null) {
            primary.href =
                content[`primaryButton.url`];
        }

        if (content[`primaryButton.newPage`]) {
            primary.target = `_blank`;
            primary.rel = `noopener noreferrer`;
        }

        buttons.appendChild(primary);
    }

    contentWrap.appendChild(buttons);



    // Logo
    const spaceWrap = documentHTML.createElement(`div`);
    spaceWrap.classList.add(`${prefix}content-header-space`);

    contentWrap.appendChild(spaceWrap);
    

    // Now! Start with layout!
    contentWrap.classList.add(
        `${prefix}content-header-menumode${layout.desktopMenuMode}`
    );

    const positionMap = {
        1: {
            logo: "onleft",
            nav: "oncenter",
            cta: "onright",
            space: "onhidden"
        },
        2: {
            logo: "onleft",
            nav: "onleft",
            cta: "oncenter",
            space: "onright"
        },
        3: {
            logo: "onleft",
            nav: "onleft",
            cta: "onright",
            space: "oncenter"
        },
        4: {
            logo: "oncenter",
            nav: "onleft",
            cta: "onright",
            space: "onhidden"
        },
        5: {
            logo: "onleft",
            nav: "onright",
            cta: "oncenter",
            space: "onhidden"
        },
        6: {
            logo: "onleft",
            nav: "onright",
            cta: "onright",
            space: "oncenter"
        },
        7: {
            logo: "oncenter",
            nav: "onright",
            cta: "onright",
            space: "onleft"
        }
    };

    const position = positionMap[layout.desktopPosition];

    if (position) {
        logoWrap.classList.add(
            `${prefix}content-header-${position.logo}`
        );

        nav.classList.add(
            `${prefix}content-header-${position.nav}`
        );

        buttons.classList.add(
            `${prefix}content-header-${position.cta}`
        );
        
        spaceWrap.classList.add(
        	`${prefix}content-header-${position.space}`
        );
    }


    return header;
}




document.getElementById(`generateButton`).addEventListener("click", () => {
    const preview = document.getElementById(`preview`);

        createHeader(
            sampleData,
            document,
            preview,
            null
        )

        startRuntime(preview)
});

document.getElementById(`generateButton`).click();

    </script>
